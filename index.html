function assumeLine(){let lg=false;for(let d=0;d<7;d++)if(lifeGaps(d).length)lg=true;return '<p class="xs muted assume">하루 '+hm(S.setup.dayStart)+'–'+hm(S.setup.dayEnd)+' 기준'+(lg?' · 오후 고정 일정 뒤 1시간은 귀가·식사로 가정':'')+' <button type="button" class="link" data-act="tab" data-tab="memory">고치기</button></p>';}
function nextItem(wk,t,n,skip){
  const it=dayItems(wk,t,'today'),c=[];
  for(const b of it.bl)if(!b.done&&b.start>n&&b.id!==skip)c.push({start:b.start,label:b.title});
  for(const f of it.fx)if(f.t==='fixed'&&f.start>n)c.push({start:f.start,label:f.label});
  c.sort((a,b)=>a.start-b.start);return c[0]||null;
}

function timelineHtml(wk,d){

    const hh=Math.max(14,y(f.end)-y(f.start)-4);
    h+='<div class="fx t-'+f.t+'" style="top:'+(y(f.start)+2)+'px;height:'+hh+'px"><span>'+esc(f.label)+(f.t==='fixed'&&hh>34?' <small>고정</small>':'')+'</span>'+(f.t==='fixed'&&hh>20?'<span class="mono">'+hm(f.start)+'–'+hm(f.end)+'</span>':'')+'</div>';
  }

    h+='<button type="button" class="gap" style="top:'+(y(g.start)+2)+'px;height:'+hh+'px" data-act="gap" data-k="'+wk.key+'" data-d="'+d+'" data-s="'+g.start+'" data-e="'+g.end+'"><span aria-hidden="true">+</span>빈 시간 · '+durLabel(g.end-g.start)+'</button>';}
  for(const b of it.bl)h+=blockHtml(wk,b,mode,y);

  if(gp&&gp.key===wk.key)gp.blocks.forEach((b,i)=>{if(b.day!==d||b.off)return;const hh=Math.max(26,Math.round(b.dur*PX)-4);
    h+='<button type="button" class="blk ghost'+(hh<46?' short':'')+'" style="top:'+(y(b.start)+2)+'px;height:'+hh+'px" data-act="pp-blk" data-i="'+i+'" aria-label="'+esc('AI 제안, 미확정: '+b.title+' '+hm(b.start))+'"><span class="blk-t">'+esc(b.title)+'</span><span class="blk-m">'+(hh<46?'':hm(b.start)+'–'+hm(b.start+b.dur)+' · ')+'AI 제안 · 미확정</span></button>';});

/* ---------- actions (new) → falls through to the original handler ---------- */
function act(a,d){
  const g=guideState();
  if(gameAct(a,d))return;
  if(a==='alt-rest'||a==='rest-mark')markRest();
  switch(a){
    case 'me-close':ui.tab='profile';ui.confirmWipe=false;window.scrollTo(0,0);render();return;
    case 'blk-done':case 'block-done':{
      const wk=a==='blk-done'?S.weeks[d.k]:getWeek(curKey());const b=wk&&wk.blocks.find(x=>x.id===d.id);const was=b&&b.done;
      actBase(a,d);
      if(b&&!was&&b.done)award('done:'+b.id,b.goalId?15:10,'끝냈어요',true);
      else if(b&&was&&!b.done){revoke('done:'+b.id);}
      store.save();render();return;}

    case 'ai-test':testAi();return;
    case 'g-send':{const v=val('gText');if(!v)return;clearInput('gText');guideSend(v);return;}
    case 'g-chip':{
      const v=d.v;
      if(v==='오늘 보기'){ui.tab='today';ui.scrollNow=true;window.scrollTo(0,0);render();return;}
      if(v==='이번 주 보기'){ui.tab='week';ui.scrollNow=true;window.scrollTo(0,0);render();return;}

        if(b){g.msgs.push({id:uid(),role:'me',text:v});
          if(v==='취소'){wk.blocks=wk.blocks.filter(x=>x!==b);pushGuide({text:"'"+b.title+"'을(를) 뺐어요."});ui.lastEvent=null;}
          else{b.dur=60;pushGuide({text:"'"+b.title+"'을(를) "+hm(b.start)+'–'+hm(b.start+60)+'로 줄였어요.'});}
          ui.gScroll=true;commit();return;}}
      guideSend(v);return;}
    case 'g-reset':g.msgs=[];g.draft=null;commit();return;
    case 'pp-open':ui.ppMsg=Number(d.m);ui.ppAsk=false;ui.tab='proposal';window.scrollTo(0,0);render();return;

    case 'pp-allok':{const p=curProp();if(p)p.blocks.forEach(b=>{if(b.check)b.checked=true;});commit();return;}
    case 'pp-move':{const p=curProp();const b=p&&p.blocks[Number(d.i)];if(!b)return;b.day=Number(d.d);b.start=Number(d.s);b.check=checkFor(b.day,b.start);b.checked=!!b.check;

  if(!g)return null;
  g.headY=L0;
  /* time axis: read the hour number beside each hour line, then vote for the start hour */
  const gl=Math.round(g.cols[0].cx-g.pitch*0.5)-2;
  if(gl<20)return null;
  const ext=[];for(let y=L0;y<cv.height-P*0.3&&ext.length<18;y+=P)ext.push(y);
  for(let i=0;i<ext.length;i++){const n=reg.find(r=>Math.abs(r-ext[i])<P*0.15);if(n!=null)ext[i]=n;}
  const rd=[];
  for(const y of ext){
    let v=null;
    for(const psm of ['7','8','10']){
      const ws=await ocrReadBand(cv,w,0,y-P*0.5,gl,y+P*0.5,psm,'0123456789:');
      const n=ws.map(o=>/^(\d{1,2})(?::\d{2})?$/.exec(o.t.replace(/[^\d:]/g,''))).find(m=>m);
      if(n){v=Number(n[1]);break;}
    }
    rd.push(v);
  }
  const got=rd.filter(v=>v!=null).length;
  let best=null;
  for(const st of [1,2])for(let par=0;par<st;par++)for(let h0=5;h0<=14;h0++){
    let sc=0;
    for(let i=par;i<rd.length;i+=st){const H=h0+(i-par)/st,v=rd[i];if(v!=null&&(v===H||v===(H>12?H-12:H)))sc++;}
    const s2=sc-(st-1)*0.5;
    if(!best||s2>best.s)best={s:s2,sc,st,par,h0};
  }
  if(!best||best.sc<2||best.sc<got*0.4)return null;
  const pts=[];for(let i=best.par;i<ext.length;i+=best.st)pts.push([best.h0+(i-best.par)/best.st,ext[i]]);
  const f=ocrFit(pts);if(!f||f.b<15)return null;
  hourPx=f.b;
  const mapY=y=>Math.round(60*(y-f.a)/f.b);
  const blocks=ocrBlocks(cv,g,mapY,f.b,Math.round(L0)+2).filter(b=>b.start>=0&&b.end<=1500&&b.end>b.start);
  if(!blocks.length)return null;
  /* label each distinct (time,color) group once */
  const groups={};
  for(const b of blocks){const k=Math.round(b.start/5)+'|'+Math.round(b.end/5)+'|'+b.color;(groups[k]=groups[k]||[]).push(b);}
  const keys=Object.keys(groups).slice(0,30),labels={};
  await w.setParameters({tessedit_pageseg_mode:'6',tessedit_char_whitelist:''});
  let n=0;
  for(const k of keys){
    const b=groups[k][0];ocrStage('칸 이름을 읽는 중이에요 ('+(++n)+'/'+keys.length+')…');
    const c=ocrCrop(cv,b.cx-g.pitch*0.5+2,b.y0+2,b.cx+g.pitch*0.5-2,Math.min(b.y1-2,b.y0+Math.max(hourPx*0.45,60)));
    let t='';if(c){try{const r=await w.recognize(c);t=r.data.text;}catch(e){}}
    labels[k]=ocrLabel(t)||'고정 일정';
  }
  const items=[];
  for(const k of keys)for(const b of groups[k])items.push({days:[b.d],start:Math.round(b.start/5)*5,end:Math.round(b.end/5)*5,label:labels[k]});
  return items;
}
async function ocrTimetable(imgs){
  const w=await ocrWorker();let items=[];
  for(const f of imgs.slice(0,4)){
    const cv=await ocrCanvas(f,1600);
    ocrStage('캡처를 읽는 중이에요…');
    let got=null;
    try{got=await ocrGridRead(cv,w);}catch(e){got=null;}
    if(!got||!got.length){
      await w.setParameters({tessedit_pageseg_mode:'6',tessedit_char_whitelist:''});
      const r2=await w.recognize(cv);got=parseFixedText(r2.data.text||'');
    }
    items=items.concat(got||[]);
  }
  return mergeItems(items).slice(0,40);
}
async function readTimetable(imgs){
  const r=await readTimetableAI(imgs);
  if(r&&r.length)return r;
  ui.err.fxai='';
  try{
    ui.fxStage='이 화면에서는 AI 없이 기기에서 읽어요. 잠시만요…';render();

  }catch(e){

  }
  return null;
}

function gameS(){

  if(!Array.isArray(G.log))G.log=[];if(!G.rest||typeof G.rest!=='object')G.rest={};if(!G.q||typeof G.q!=='object')G.q={};
  if(G.gender!=='m'&&G.gender!=='f')G.gender=null;if(!PTYPE[G.ptype])G.ptype=null;G.best=G.best||0;

function activeDays(){const G=gameS(),s=new Set();for(const k in G.rest)if(G.rest[k])s.add(k);for(const e of G.log)if(e.a)s.add(e.d);return s;}

/* ---------- AI server (outside the Claude app): same interface as `sample` ---------- */
const AI_URL_DEFAULT='https://daeum-ai.jmingyu2006.workers.dev';
function aiUrl(){const u=(S.setup&&S.setup.aiUrl)||'';if(u)return u;try{return localStorage.getItem('daeum-ai-url')||AI_URL_DEFAULT;}catch(e){return AI_URL_DEFAULT;}}
function remoteSample(url){
  const call=async(input,opts,asJson)=>{
    opts=opts||{};
    const msgs=typeof input==='string'?[{role:'user',content:input}]:input;
    let r;
    try{r=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({messages:msgs,json:!!asJson,tier:opts.modelTier||'default'}),signal:opts.signal});}
    catch(e){if(e&&e.name==='AbortError')throw {code:'cancelled'};throw {code:'network'};}
    if(r.status===429)throw {code:'rate_limited'};
    if(!r.ok)throw {code:'server'};
    let j;try{j=await r.json();}catch(e){throw {code:'server'};}
    if(!j||typeof j.text!=='string')throw {code:'server'};
    return j.text;
  };
  const s=async(input,opts)=>{const t=await call(input,opts,false);if(opts&&opts.onText)opts.onText({text:t,delta:t});return {text:t,truncated:false};};
  s.json=async(input,opts)=>{
    const t=await call(input,opts,true);
    try{return JSON.parse(t);}catch(e){const m=/\{[\s\S]*\}/.exec(t);if(m){try{return JSON.parse(m[0]);}catch(e2){}}throw {code:'parse'};}
  };
  s.limits=async()=>({images:false});
  s.remote=true;
  return s;
}
function getSample(){
  if(!samplePromise)samplePromise=(async()=>{
    let s=null;
    if(window.claude&&window.claude.use)s=await window.claude.use('sample').catch(()=>null);
    if(!s){const u=aiUrl();if(u)s=remoteSample(u);}
    return s;
  })();
  return samplePromise;
}
function setAiUrl(v){
  v=String(v||'').trim();
  if(v&&!/^https:\/\//i.test(v)&&!/^http:\/\/(localhost|127\.0\.0\.1)/i.test(v))v='https://'+v.replace(/^\/+/,'');
  S.setup.aiUrl=v.slice(0,300);try{localStorage.setItem('daeum-ai-url',S.setup.aiUrl);}catch(e){}
  samplePromise=null;aiOff=false;store.save();
}
async function testAi(){
  ui.aiTest='pending';render();
  try{
    const s=await getSample();
    if(!s){ui.aiTest='noaddr';render();return;}
    const t0=Date.now();const r=await s.json('JSON 하나로만 답하라: {"ok":true,"say":"한 문장으로 인사"}',{cache:false});
    ui.aiTest=r&&(r.ok||r.say)?'ok':'bad';ui.aiMs=Date.now()-t0;
  }catch(e){ui.aiTest=e&&e.code==='network'?'net':e&&e.code==='rate_limited'?'rate':'bad';}
  render();
}
function devMode(){try{if(/[?&]dev=1/.test(location.search))localStorage.setItem('daeum-dev','1');if(/[?&]dev=0/.test(location.search))localStorage.removeItem('daeum-dev');return localStorage.getItem('daeum-dev')==='1';}catch(e){return false;}}
function aiCard(){
  if(!devMode())return '';
  const inClaude=!!(window.claude&&window.claude.use),u=(S.setup&&S.setup.aiUrl)||aiUrl();
  const st=ui.aiTest,msg=st==='pending'?'확인하는 중이에요…':st==='ok'?'연결됐어요 ('+Math.round((ui.aiMs||0)/100)/10+'초). 이제 길잡이가 AI로 답해요.':st==='noaddr'?'주소를 먼저 넣어 주세요.':st==='net'?'서버에 닿지 않아요. 주소와 인터넷 연결을 확인해 주세요.':st==='rate'?'요청이 많아요. 잠시 뒤 다시 눌러 주세요.':st==='bad'?'서버는 응답했지만 답을 읽지 못했어요. 주소가 맞는지 확인해 주세요.':'';
  return '<div class="card line"><h2>AI 서버</h2><p class="small muted">'+(inClaude?'Claude 앱 안에서는 따로 설정하지 않아도 길잡이가 AI로 답해요. 앱 밖(휴대폰 브라우저)에서 쓸 때만 서버 주소를 넣으세요.':'휴대폰 브라우저에서 길잡이를 AI로 쓰려면 서버 주소를 넣으세요. 비워 두면 기본 규칙으로 동작해요.')+'</p>'+
    '<label class="label" for="aiUrl">서버 주소</label><input id="aiUrl" class="field" data-field="ai-url" value="'+esc(u)+'" placeholder="https://daeum-ai.내계정.workers.dev" inputmode="url" autocapitalize="off" autocomplete="off" spellcheck="false">'+
    '<div class="row" style="gap:10px;align-items:center"><button type="button" class="btn sm" data-act="ai-test"'+(st==='pending'?' disabled':'')+'>연결 확인</button><span class="small'+(st==='ok'?'':' muted')+'" role="status">'+esc(msg)+'</span></div></div>';
}

/* ---------- boot ---------- */
getSample().then(sm=>sm&&sm.limits?sm.limits():null).then(c=>{if(c&&c.images){ui.imgOK=true;ui.imgTypes=(c.images.mediaTypes||[]).join(',');render();}}).catch(()=>{});
S=emptyState();
render();
setSaveState('');
store.ready=store.init().then(data=>{
  const d=migrate(data);
  if(d){S=d;S.demo=false;ui.tab='today';if(!S.profile.done)ui.onb=1;render();setSaveState(store.mode==='db'?'저장됨':store.mode==='local'?'이 브라우저에 저장됨':'이 창에서만 유지');}
  else{render();setSaveState(store.mode==='memory'?'이 창에서만 유지':'');}
});
})();
</script>

<script>if('serviceWorker' in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
