/* ---------- type ---------- */
body{background:var(--bg);color:var(--fg)}
h1{font-weight:850;letter-spacing:-1px}
h2{font-weight:800;letter-spacing:-.5px}
.label{font-weight:750}

/* ---------- surfaces: white cards float on the tinted canvas ---------- */
.card,.list,.stat,.rt-card,.rt-row,.rt-empty,.wg,.ag,.first-card,.ex,.g-body>p,.pp-blk,.first-act,.tl-scroll,.help,.opt{box-shadow:var(--sh1)}
.card{border-radius:var(--r)}
.card.dashed,.card.soft,.card.warn{box-shadow:none}
.card.soft{background:var(--accent-soft);color:var(--fg)}
.stat{border-radius:20px}

/* ---------- top bar ---------- */
.top{background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.brand{gap:7px;font-size:19px;font-weight:900;letter-spacing:-.8px}
.brand-mc{display:inline-flex;width:30px;height:30px;margin:-4px 0 -2px -2px}
.brand-mc svg{display:block}
.hd-chip{background:var(--surface);box-shadow:var(--sh1);border-radius:999px}
.vi{display:inline-flex;flex-shrink:0;color:var(--muted)}.vi svg{width:100%;height:100%;display:block}
.mc-wrap{display:inline-flex;flex-shrink:0;line-height:0}
.mc-wrap svg{display:block}

/* ---------- buttons: chunky lip, one action colour ---------- */
.btn{border-radius:16px;font-weight:750;box-shadow:inset 0 0 0 2px var(--line),0 4px 0 var(--line)}
.btn.primary{background:var(--accent);color:var(--on-accent);box-shadow:0 4px 0 var(--accent-edge)}
.btn.sm{border-radius:13px;box-shadow:inset 0 0 0 2px var(--line),0 3px 0 var(--line)}
.btn.sm.primary{box-shadow:0 3px 0 var(--accent-edge)}
.btn:active:not([disabled]){transform:translateY(4px);box-shadow:inset 0 0 0 2px var(--line)}
.btn.primary:active:not([disabled]){box-shadow:none}
.btn.ghost{box-shadow:none;color:var(--accent-text)}
.chip,.sheet .chip{border:2px solid var(--line);background:var(--surface);font-weight:700}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.link{color:var(--accent-text);font-weight:700}
.field{border:2px solid var(--line);border-radius:16px;background:var(--surface)}
.field:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 16%,transparent)}
.icon-btn{box-shadow:inset 0 0 0 2px var(--line)}
.icon-btn.fill{background:var(--accent);color:var(--on-accent);box-shadow:0 3px 0 var(--accent-edge)}
.tgl.on{background:var(--accent)}

/* ---------- floating tab bar (capsule, translucent) ---------- */
.tabs{left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));
  border-radius:28px;padding:6px;background:color-mix(in srgb,var(--surface) 86%,transparent);box-shadow:var(--sh2),inset 0 0 0 1px color-mix(in srgb,var(--line) 70%,transparent)}
.tabs .inner{gap:2px}
.tabs button{border-radius:22px;min-height:56px;color:var(--muted);font-weight:700}
.tabs button.on{background:var(--accent-soft);color:var(--accent-text)}
.tabs button svg{width:25px;height:25px}
.fab{bottom:calc(96px + env(safe-area-inset-bottom,0px));border-radius:22px;background:var(--accent);box-shadow:0 5px 0 var(--accent-edge),0 10px 24px color-mix(in srgb,var(--accent) 35%,transparent)}
.g-compose{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
#app{padding-block:0 170px}

/* ---------- "now" hero: dusk gradient, sunrise progress ---------- */
.now-card{background:linear-gradient(150deg,color-mix(in srgb,var(--hero) 80%,#8C6CFF) 0%,var(--hero) 55%,color-mix(in srgb,var(--hero) 82%,#000) 100%);box-shadow:0 6px 0 var(--hero-edge),var(--sh2);border-radius:28px;position:relative;overflow:hidden}
.now-card:after{content:"";position:absolute;right:-60px;bottom:-90px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--rise) 55%,transparent),transparent 70%);opacity:.55;pointer-events:none}
.now-card>*{position:relative;z-index:1}
.now-tag i{background:var(--sun)}
.now-bar i{background:linear-gradient(90deg,var(--sun),var(--rise))}
.now-card .btn{background:rgba(255,255,255,.16);box-shadow:0 3px 0 rgba(0,0,0,.2)}
.now-card .btn.primary{background:#fff;color:#3A22B8;box-shadow:0 4px 0 rgba(20,8,70,.35)}
.now-card .now-guide{right:10px;top:8px}

/* ---------- timeline (Structured-style nodes) ---------- */
.ag-list{position:relative;gap:8px}
.ag-list:before{content:"";position:absolute;left:83px;top:16px;bottom:16px;width:3px;border-radius:3px;background:var(--line)}
.ag{position:relative;border-radius:20px;padding:10px 14px 10px 10px;gap:12px;min-height:64px;background:var(--surface)}
.ag-t{flex:0 0 44px;text-align:right;font-size:12.5px;font-weight:650}
.ag-bar{display:none}
.ag-node{flex:0 0 40px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:19px;line-height:1;position:relative;z-index:1;
  background:color-mix(in srgb,var(--kc,var(--accent)) 18%,var(--surface));box-shadow:0 0 0 3px var(--surface),inset 0 0 0 2px color-mix(in srgb,var(--kc,var(--accent)) 55%,transparent)}
.ag-fx .ag-node{--kc:hsl(var(--h,250) 60% 55%)}
.ag.ag-fx{background:var(--surface)}
.ag.ag-fx .ag-m b{color:var(--fg)}
.ag.ag-gap{background:transparent;box-shadow:none;border:2px dashed var(--line)}
.ag.ag-gap .ag-node{background:var(--bg);box-shadow:0 0 0 3px var(--bg),inset 0 0 0 2px var(--line);color:var(--muted);font-size:20px;font-weight:700}
.ag.blk-r.st-done .ag-node{background:var(--ok);color:#fff;font-weight:900;box-shadow:0 0 0 3px var(--surface)}
.ag.blk-r.st-done{background:var(--surface)}
.ag.blk-r.st-done .ag-m b{color:var(--muted)}
.ag.blk-r.st-now{outline:0;box-shadow:0 0 0 2.5px var(--now),var(--sh2)}
.ag.blk-r.st-now .ag-node{background:var(--now);color:#fff;box-shadow:0 0 0 3px var(--surface),0 0 0 7px color-mix(in srgb,var(--now) 25%,transparent)}
.ag.blk-r.st-miss,.ag.blk-r.sk{background:var(--sunk);box-shadow:none}
.ag.blk-r.st-miss .ag-node,.ag.blk-r.sk .ag-node{filter:grayscale(1);opacity:.55;box-shadow:0 0 0 3px var(--sunk)}
.ag-s{color:var(--now);font-weight:800;font-size:13px}

/* ---------- week grid ---------- */
.wg{border-radius:26px}
.wg-head button.on{background:var(--accent);color:var(--on-accent)}
.wg-head button.on b{color:var(--on-accent)}
.wg-head button.td b{color:var(--rise)}
.wg-head button.on.td b{color:var(--on-accent)}
.wg .wg-col.sel{background:color-mix(in srgb,var(--accent) 8%,var(--surface));outline-color:color-mix(in srgb,var(--accent) 50%,transparent)}
.wg-col .nl{background:var(--now);height:3px;border-radius:2px}
.wk-nav .icon-btn{background:var(--surface);box-shadow:var(--sh1)}

/* ---------- guide chat ---------- */
.msg.me p{background:var(--accent);color:var(--on-accent);border-radius:22px 22px 6px 22px}
.g-body>p{border-radius:6px 22px 22px 22px;background:var(--surface)}
.g-ava.px-ava{width:44px;height:44px;border-radius:16px;background:var(--rise-soft);overflow:hidden;align-items:flex-end}
.g-ava.px-ava .mc-wrap svg{margin-bottom:-8px}
.ai-note{background:var(--accent-soft);color:var(--fg)}
.chip.opt{background:var(--accent-soft);color:var(--accent-text);border-color:transparent}
.g-compose .field{border-radius:22px;box-shadow:var(--sh1)}

/* ---------- profile ---------- */
.pf-card{border-radius:30px;box-shadow:0 6px 0 color-mix(in srgb,var(--c1) 70%,#000),var(--sh2)}
.pf-card:before{background-image:radial-gradient(rgba(255,255,255,.16) 1.6px,transparent 1.7px);background-size:18px 18px}
.pf-lv{font-family:var(--font);font-weight:900;border-radius:12px;box-shadow:0 3px 0 #C98F12}
.pf-bar{height:14px;border-radius:9px}
.pf-bar i{background:linear-gradient(90deg,var(--sun),var(--rise));box-shadow:none}
.pf-stage .mc-wrap{filter:drop-shadow(0 6px 0 rgba(0,0,0,.12))}
.pf-badge.on{background:color-mix(in srgb,var(--sun) 18%,var(--surface))}
.pf-ic .vi{width:20px;height:20px}
.streak-line .vi,.hd-chip .vi{width:18px;height:18px}

/* ---------- routines ---------- */
.rt-row{border-radius:22px}
.rt-ck{border-radius:50%;box-shadow:inset 0 0 0 2.5px var(--line),0 3px 0 var(--line)}
.rt-ck.on{background:var(--ok);box-shadow:0 3px 0 color-mix(in srgb,var(--ok) 60%,#000)}
.rt-pot{border-radius:24px;background:linear-gradient(transparent 68%,color-mix(in srgb,var(--ok) 12%,var(--surface)) 68%),color-mix(in srgb,var(--sun) 14%,var(--surface))}
.rt-bar i{background:var(--ok)}
.rt-fresh{background:linear-gradient(135deg,var(--rise-soft),color-mix(in srgb,var(--sun) 22%,var(--surface)));box-shadow:none}
.rt-empty-art{background:color-mix(in srgb,var(--ok) 12%,var(--surface))}

/* ---------- onboarding ---------- */
.onb-guide{align-items:center}
.onb-guide .bubble{margin-bottom:0;box-shadow:var(--sh1);border-radius:20px}
.onb-guide .bubble:before{display:none}
.ex{border-radius:26px}
.ex-plan{background:var(--rise-soft);color:var(--fg)}
.ex-plan .xs{color:var(--rise);font-weight:800}
.path{border-radius:24px}
.path.main{box-shadow:0 5px 0 var(--accent-edge)}
.first-card{box-shadow:var(--sh2);border-radius:28px}
.first-card .mc-wrap{margin-top:-4px}

/* ---------- sheets & toasts ---------- */
.sheet{border-radius:30px 30px 0 0;box-shadow:0 -10px 40px rgba(20,10,50,.18)}
.seg2{border-radius:18px}
.seg2 button.on{box-shadow:var(--sh1)}
.toast{border-radius:16px;background:var(--fg);color:var(--bg);box-shadow:var(--sh2)}
.toast.xp{background:#2A1E52;color:#fff;border-color:var(--sun)}
.chg{border-radius:22px}

/* ---------- celebration: sunrise burst ---------- */
.cele{border-radius:32px;box-shadow:var(--sh2)}
.cele-rays{background:repeating-conic-gradient(color-mix(in srgb,var(--sun) 30%,transparent) 0 12deg,transparent 12deg 24deg)}

@media (prefers-reduced-motion:reduce){.fab,.btn{transition:none}}

/* ---------- pixel companions (2026.10 v2) ---------- */
.brand-mc{width:34px;height:34px;margin:-6px -2px -4px -4px;overflow:hidden;display:inline-flex;align-items:center;justify-content:center}
.brand-mc img{width:44px;height:44px;image-rendering:pixelated;margin-top:6px}
.g-ava.px-ava{width:46px;height:46px;border-radius:16px;background:var(--accent-soft);display:inline-flex;align-items:flex-end;justify-content:center;overflow:hidden}
.g-ava.px-ava .px{width:44px;margin:0 0 -2px}
.px{image-rendering:pixelated;image-rendering:crisp-edges}
.pf-stage{padding-top:10px}
.now-card .now-guide{right:8px;top:4px}
.rt-pot{background:linear-gradient(transparent 68%,color-mix(in srgb,var(--ok) 12%,var(--surface)) 68%),#EAF6FF}
.first-card .px{align-self:flex-start}

/* ================= trust.css — 편집·보관함·찾기·달력·설정 묶음 ================= */
/* 하루 목록: 오른쪽 체크 */
.ag-wrap{position:relative}
.ag-wrap.has-ck>.ag{padding-right:62px}
.ag-ck{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;border:0;cursor:pointer;z-index:2;
  background:var(--surface);box-shadow:inset 0 0 0 2.5px color-mix(in srgb,var(--accent) 45%,var(--line));color:#fff;font:900 18px/1 var(--font);display:grid;place-items:center;padding:0}
.ag-ck:hover{box-shadow:inset 0 0 0 2.5px var(--accent)}
.ag-ck.on{background:var(--ok);box-shadow:none}
.ibx-row .ag-ck,.due .ag-ck{position:static;transform:none;flex-shrink:0;width:34px;height:34px}
.ag-wrap .ag-s{margin-right:2px}
.ag.ag-fx{cursor:pointer}

/* 종일 일정 */
.ad-row{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.ad-chip{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;border:0;cursor:pointer;text-align:left;font:inherit;
  padding:10px 14px;border-radius:16px;background:color-mix(in srgb,var(--sun) 26%,var(--surface));color:var(--fg);box-shadow:inset 4px 0 0 var(--rise)}
.ad-chip b{font-size:15px}.ad-chip span{font-size:12.5px;color:var(--muted);flex-shrink:0}

/* 블록 편집 */
.blk-edit,.blk-more{border-radius:18px;background:var(--sunk);padding:4px 14px}
.blk-edit summary,.blk-more summary{cursor:pointer;min-height:46px;display:flex;align-items:center;font-weight:750;color:var(--accent-text)}
.blk-edit[open],.blk-more[open]{padding-bottom:14px}
.blk-edit[open]>*:not(summary),.blk-more[open]>*:not(summary){margin-top:8px}
.blk-more{display:flex;flex-direction:column}
.blk-more .field{background:var(--surface)}
.be-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.be-grid .be-f:first-child:nth-last-child(3){grid-column:1/-1}
.be-grid.two{grid-template-columns:1fr 1fr}
.be-f{display:flex;flex-direction:column;gap:3px;min-width:0}
.be-f .field{min-height:48px;padding:8px 10px;font-weight:700;font-size:15px;width:100%;min-width:0}
.trn-warn{color:var(--warn-text);font-weight:650}
.trn-note{color:var(--warn-text);background:var(--warn-soft);padding:8px 10px;border-radius:12px;margin:0}
.subs{display:flex;flex-direction:column;gap:6px}
.sub-row{display:flex;align-items:center;gap:10px;padding:4px 0}
.sub-row.on .grow{color:var(--muted);text-decoration:line-through}
.sub-ck{width:28px;height:28px;border-radius:9px;border:0;cursor:pointer;background:var(--surface);box-shadow:inset 0 0 0 2px var(--line);color:#fff;font:900 14px/1 var(--font);flex-shrink:0;padding:0}
.sub-row.on .sub-ck{background:var(--ok);box-shadow:none}
.sub-add{display:flex;gap:8px}.sub-add .field{flex:1;min-height:44px}
.icon-btn.sm{width:34px;height:34px;min-height:34px;font-size:18px}

/* 추가하기 */
.add-min{position:relative;padding:0 10px 0 4px!important;gap:2px;display:inline-flex;align-items:center}
.add-min input{width:58px;border:0;background:transparent;font:inherit;font-weight:700;color:inherit;text-align:right;padding:0 2px;min-height:38px;outline:0}
.add-min input::placeholder{color:var(--muted);font-weight:600}
.add-min.on input::placeholder{color:inherit}
.add-multi{min-height:110px;line-height:1.6;resize:vertical}
.add-ad{margin-top:-4px}
.add-dl .label{display:flex;align-items:center;gap:4px}
.chg-pad{margin:0;color:var(--muted)}

/* 기록 정리 */
.rec-head{display:flex;flex-direction:column;gap:4px;padding:2px 2px 0}
.rec-card{gap:6px}.rec-card b{font-size:17px}

/* 보관함 */
.ibx-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.ibx-row:first-of-type{border-top:0}
.ibx-main{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:1px;border:0;background:transparent;padding:4px 0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.ibx-main b{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.ibx.empty{box-shadow:none;background:transparent;border:2px dashed var(--line)}
.ibx-fin summary{cursor:pointer;min-height:40px;display:flex;align-items:center;color:var(--muted)}
.ibx-row.on .grow{color:var(--muted);text-decoration:line-through}
.due{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--rise) 45%,transparent),var(--sh1)}

/* 길잡이 주 선택 */
.g-wk{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:4px 6px;border-radius:999px;background:var(--surface);box-shadow:var(--sh1);font-size:14px}
.g-wk span{flex:1;text-align:center}.g-wk b{color:var(--accent-text)}
.g-wk .icon-btn{box-shadow:none}
.g-wk .icon-btn[disabled]{opacity:.3}

/* 찾기 */
.hd-ic{width:40px;height:40px;border-radius:50%;border:0;background:var(--surface);box-shadow:var(--sh1);color:var(--fg);display:inline-grid;place-items:center;cursor:pointer;padding:0;margin-right:6px}
#hdGame{display:inline-flex;align-items:center}
.sr-box .field{min-height:54px;font-size:17px}
.sr-sec{display:flex;flex-direction:column;gap:8px}
.sr-list{display:flex;flex-direction:column;gap:6px}
.sr-row{display:flex;align-items:center;gap:12px;width:100%;border:0;text-align:left;font:inherit;color:inherit;cursor:pointer;background:var(--surface);border-radius:18px;padding:10px 14px;box-shadow:var(--sh1)}
div.sr-row{cursor:default}
.sr-row b{font-size:15.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr-row .grow{min-width:0}
.sr-row.past{opacity:.72}
.sr-d{flex:0 0 46px;display:flex;flex-direction:column;align-items:center;font-weight:800;font-size:14px;color:var(--accent-text)}
.sr-d small{font-size:11.5px;color:var(--muted);font-weight:650}

/* 달력 */
.wk-tools{display:flex;justify-content:center;gap:8px;margin-top:-8px}
.mo-head{display:flex;align-items:center;justify-content:space-between}
.mo-w,.mo-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.mo-w span{text-align:center;font-size:12.5px;color:var(--muted);font-weight:700}
.mo-c{min-height:56px;border:0;border-radius:14px;background:var(--sunk);color:var(--fg);font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:2px;padding:6px 2px;position:relative;overflow:hidden}
.mo-c b{font-size:15px}
.mo-c.out{opacity:.4}
.mo-c.pst b{color:var(--muted)}
.mo-c.td{box-shadow:inset 0 0 0 2px var(--accent)}
.mo-c.sel{background:var(--accent);color:var(--on-accent)}.mo-c.sel b{color:var(--on-accent)}
.mo-ad{font-size:10px;line-height:1.2;max-width:100%;padding:1px 3px;border-radius:5px;background:color-mix(in srgb,var(--sun) 50%,transparent);color:var(--fg);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.mo-dots{display:flex;gap:3px;align-items:center;margin-top:auto}
.mo-dots i{display:block;width:6px;height:6px;border-radius:50%}
.mo-dots i.f{background:color-mix(in srgb,var(--fg) 30%,transparent)}
.mo-dots i.n0{display:none}.mo-dots i.n1{background:color-mix(in srgb,var(--accent) 45%,transparent)}.mo-dots i.n2{background:color-mix(in srgb,var(--accent) 75%,transparent)}.mo-dots i.n3{background:var(--accent)}
.mo-c.sel .mo-dots i{background:var(--on-accent)}

/* 설정 묶음 */
.me-tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:4px;border-radius:18px;background:var(--sunk);position:sticky;top:64px;z-index:5}
.me-tabs button{min-height:44px;border:0;border-radius:14px;background:transparent;font:700 15px var(--font);color:var(--muted);cursor:pointer}
.me-tabs button.on{background:var(--surface);color:var(--fg);box-shadow:var(--sh1)}
.fb textarea{min-height:90px}

/* 루틴 */
.rt-acts{display:flex;align-items:center;gap:2px;flex-shrink:0;align-self:flex-start}
.rt-dots button{aspect-ratio:1;border-radius:5px;display:block;border:0;padding:0;cursor:pointer;background:var(--sunk)}
.rt-dots button.d-f{background:var(--ok)}
.rt-dots button.d-m{background:linear-gradient(135deg,var(--ok) 50%,color-mix(in srgb,var(--ok) 30%,var(--surface)) 50%)}
.rt-dots button.d-x{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.rt-dots button.d-r{background:repeating-linear-gradient(-45deg,var(--sunk) 0 3px,transparent 3px 6px)}
.rt-dots button.d-td{background:transparent;box-shadow:inset 0 0 0 2px var(--accent)}

/* 가져오기 */
.imp-row.bad{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--warn-text) 50%,transparent)}
.imp-unsup{gap:4px}
.tab-warn{gap:6px}

/* =====================================================================
   다음 주 · 2026.10.17 시안 — 종이배 뱃사공
   라벤더 바탕 · 흰 카드 · 보라 하나로 행동 · 남색 글자 · 오크/브라운은 작은 포인트
   ===================================================================== */
:root{
  --bg:#F7F5FF; --surface:#FFFFFF; --sunk:#F0EDFB; --line:#E5E1F4; --fg:#1F2142; --muted:#5D6080;
  --accent:#5B3DF5; --accent-edge:#4527D6; --on-accent:#FFFFFF; --accent-soft:#EEEAFF; --accent-text:#4A2CE0;
  --sun:#FFD36B; --rise:#D08A2E; --rise-soft:#FFF3DF; --ok:#22A877; --now:#5B3DF5;
  --warn-soft:#FFEEE8; --warn-text:#A3361A;
  --hero:#5B3DF5; --hero-edge:#4527D6;
  --k-event:#E8668A;
  --sh1:0 1px 2px rgba(31,33,66,.04),0 4px 16px rgba(60,40,140,.06);
  --sh2:0 2px 6px rgba(31,33,66,.06),0 12px 32px rgba(60,40,140,.10);
  --r:22px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13111D; --surface:#1D1A2B; --sunk:#262238; --line:#332E4A; --fg:#F2F0FA; --muted:#AEABC6;
  --accent:#8D78FF; --accent-edge:#6650E0; --on-accent:#14102C; --accent-soft:#2A2550; --accent-text:#C8BCFF;
  --sun:#FFD36B; --rise:#E6A54A; --rise-soft:#33281A; --ok:#3BCB94; --now:#8D78FF;
  --hero:#4B33D6; --hero-edge:#30209A; --k-event:#FF86A6;
  --sh1:0 1px 0 rgba(255,255,255,.03),0 8px 22px rgba(0,0,0,.28); --sh2:0 12px 34px rgba(0,0,0,.45)}}
:root[data-theme="dark"]{
  --bg:#13111D; --surface:#1D1A2B; --sunk:#262238; --line:#332E4A; --fg:#F2F0FA; --muted:#AEABC6;
  --accent:#8D78FF; --accent-edge:#6650E0; --on-accent:#14102C; --accent-soft:#2A2550; --accent-text:#C8BCFF;
  --sun:#FFD36B; --rise:#E6A54A; --rise-soft:#33281A; --ok:#3BCB94; --now:#8D78FF;
  --hero:#4B33D6; --hero-edge:#30209A; --k-event:#FF86A6;
  --sh1:0 1px 0 rgba(255,255,255,.03),0 8px 22px rgba(0,0,0,.28); --sh2:0 12px 34px rgba(0,0,0,.45)}

/* 버튼: 시안처럼 납작하고 또렷하게 */
.btn{box-shadow:inset 0 0 0 1.5px var(--line);border-radius:16px}
.btn.sm{box-shadow:inset 0 0 0 1.5px var(--line);border-radius:12px}
.btn.primary,.btn.sm.primary{box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 28%,transparent)}
.btn:active:not([disabled]){transform:translateY(1px) scale(.99);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.primary:active:not([disabled]){box-shadow:none}
.btn.ghost{box-shadow:none}
.chip,.sheet .chip{border:1.5px solid var(--line)}
.field{border:1.5px solid var(--line)}
.icon-btn{box-shadow:inset 0 0 0 1.5px var(--line)}

/* 탭 바: 화면 아래 고정, 흰 바탕, 활성은 보라 */
.tabs{left:0;right:0;bottom:0;border-radius:0;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--surface) 96%,transparent);
  box-shadow:0 -1px 0 var(--line);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.tabs .inner{gap:0}
.tabs button{background:transparent!important;border-radius:14px;min-height:56px;color:var(--muted);font-weight:650;font-size:12px;gap:4px}
.tabs button.on{color:var(--accent);font-weight:800}
.tabs button svg{width:26px;height:26px}
.tabs button.on svg{stroke-width:2.3}
.tabs button.on[data-tab="profile"] svg circle,.tabs button.on[data-tab="profile"] svg path{fill:currentColor}
.tabs button.on[data-tab="guide"] svg path:first-child{fill:color-mix(in srgb,currentColor 18%,transparent)}
.fab{bottom:calc(86px + env(safe-area-inset-bottom,0px));border-radius:20px;box-shadow:0 10px 24px color-mix(in srgb,var(--accent) 38%,transparent)}
.g-compose{bottom:calc(74px + env(safe-area-inset-bottom,0px))}
#app{padding-block:0 150px}

/* 상단 */
.brand-mc{width:34px;height:34px;margin:-6px 0 -4px -4px;overflow:hidden;display:inline-flex;align-items:flex-start;justify-content:center}
.brand-mc img{width:34px;height:34px;margin:0}
.g-ava.px-ava{width:44px;height:44px;border-radius:50%;background:var(--accent-soft);display:inline-flex;align-items:flex-end;justify-content:center;overflow:hidden;flex-shrink:0}
.g-ava.px-ava .px{width:34px;height:34px;margin:0 0 2px}

/* 지금 할 일 카드: 보라 하나 */
.now-card{background:linear-gradient(155deg,#7357FF 0%,var(--hero) 60%,#4A2FD8 100%);box-shadow:0 10px 28px color-mix(in srgb,var(--hero) 30%,transparent);border-radius:26px}
.now-card:after{background:radial-gradient(circle,rgba(255,255,255,.22),transparent 70%);opacity:.5}
.now-tag i{background:var(--sun)}
.now-bar i{background:linear-gradient(90deg,var(--sun),#fff)}
.now-card .btn{background:rgba(255,255,255,.16);box-shadow:none;color:#fff}
.now-card .btn.primary{background:#fff;color:#3A22B8;box-shadow:0 6px 16px rgba(20,8,70,.25)}
.ag.blk-r.st-now{box-shadow:0 0 0 2px var(--accent),var(--sh2)}
.ag.blk-r.st-now .ag-node{background:var(--accent)}
.ag-s{color:var(--accent)}
.wg-head button.td b{color:var(--accent)}

/* ---------- 프로필 (시안) ---------- */
.pf2-top{display:flex;align-items:center;justify-content:space-between}
.pf2-top .hd-ic{width:44px;height:44px;margin:0}
.pf2-top .hd-ic svg{width:24px;height:24px}
.pf2{padding:20px 18px 18px;gap:16px;border-radius:26px}
.pf2-row{display:flex;gap:14px;align-items:flex-start}
.pf2-char{flex:0 0 96px;display:flex;justify-content:center;padding-top:4px}
.pf2-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.pf2-name{font-size:16px;color:var(--muted)}
.pf2-info h2{font-size:22px;line-height:1.3;letter-spacing:-.8px}
.pf2-info h2 em{font-style:normal;color:var(--accent)}
.pf2-say{margin:2px 0 4px;font-size:15.5px;font-weight:650}
.pf2-sls{display:flex;flex-direction:column;gap:12px;background:var(--sunk);border-radius:18px;padding:14px 14px 10px}
.sl{display:grid;grid-template-columns:62px 1fr;gap:8px;align-items:start}
.sl-l{font-size:14px;font-weight:800;padding-top:5px}
.sl-r{display:flex;flex-direction:column;gap:2px}
.sl-track{display:flex;justify-content:space-between;align-items:center;position:relative;padding:0 2px}
.sl-track:before{content:"";position:absolute;left:12px;right:12px;top:50%;border-top:2px dashed color-mix(in srgb,var(--muted) 35%,transparent)}
.sl-dot{position:relative;width:26px;height:26px;border-radius:50%;border:0;padding:0;cursor:pointer;background:var(--surface);box-shadow:inset 0 0 0 2px var(--line)}
.sl-dot:after{content:"";position:absolute;inset:8px;border-radius:50%;background:color-mix(in srgb,var(--muted) 30%,transparent)}
.sl-dot.on{background:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 20%,transparent)}
.sl-dot.on:after{background:#fff;inset:9px}
.sl-cap{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:600}
.pf2-help{gap:10px}
.pf2-hh{display:flex;align-items:center;gap:10px}
.pf2-hh h2{font-size:18px}
.pf2-ga{width:46px;height:46px;border-radius:50%;background:var(--accent-soft);display:inline-flex;align-items:flex-end;justify-content:center;overflow:hidden;flex-shrink:0}
.pf2-tip{display:flex;align-items:center;gap:10px;background:var(--sunk);border-radius:14px;padding:10px 12px;font-size:15px;font-weight:650}
.pf2-ti{width:28px;height:28px;display:inline-grid;place-items:center;color:var(--accent);flex-shrink:0}
.pf2-ti svg{width:24px;height:24px}
.pf2-link{display:flex;align-items:center;gap:12px;width:100%;border:0;font:inherit;color:var(--fg);cursor:pointer;text-align:left;padding:16px 18px;flex-direction:row}
.pf2-link b{flex:1;font-size:16.5px}
.pf2-chev{font-size:24px;color:var(--muted);line-height:1}
.pf2-grow{gap:10px}
.pf2-lv{font-weight:900;color:var(--accent);background:var(--accent-soft);border-radius:10px;padding:2px 10px}
.pf2-grow .pf-bar{height:12px;border-radius:8px;background:var(--sunk);overflow:hidden}
.pf2-grow .pf-bar i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--accent),#9C8CFF)}
.pf2-grow .pf-stats .stat{box-shadow:none;background:var(--sunk);padding:10px 6px;align-items:center;text-align:center}
.pf2-grow .pf-stats b{font-size:19px}

/* 계획 스타일·꾸미기 시트 */
.st-list{display:flex;flex-direction:column;gap:8px}
.st-opt{display:flex;align-items:center;gap:14px;width:100%;border:0;cursor:pointer;font:inherit;color:var(--fg);text-align:left;padding:10px 14px;border-radius:20px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line)}
.st-opt b{font-size:18px;display:block;letter-spacing:-.4px}
.st-opt.on{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.st-ava{width:68px;height:68px;border-radius:18px;background:var(--sunk);display:inline-flex;align-items:flex-end;justify-content:center;overflow:hidden;flex-shrink:0}
.st-opt.on .st-ava{background:var(--surface)}
.st-radio{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;box-shadow:inset 0 0 0 2px var(--line);color:#fff;font-weight:900}
.st-opt.on .st-radio{background:var(--accent);box-shadow:none}
.st-desc{margin:0}
.lk-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.lk-opt{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;cursor:pointer;font:inherit;color:var(--fg);padding:12px 8px;border-radius:20px;background:var(--sunk)}
.lk-opt:first-child{grid-column:1/-1;flex-direction:row;justify-content:center}
.lk-opt span{font-size:14.5px;font-weight:750}
.lk-opt.on{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}

/* 길잡이 */
.g-hd .px{margin-bottom:-2px}
.msg.me p{border-radius:20px 20px 6px 20px}
.g-body>p{border-radius:6px 20px 20px 20px}
.cele-rays{background:repeating-conic-gradient(color-mix(in srgb,var(--accent) 16%,transparent) 0 12deg,transparent 12deg 24deg)}
.toast.xp{background:#2A2452}
.pf-bar i{background:linear-gradient(90deg,var(--accent),#9C8CFF)}
.rt-fresh{background:linear-gradient(135deg,var(--accent-soft),color-mix(in srgb,var(--sun) 18%,var(--surface)))}
.ex-plan{background:var(--accent-soft)}.ex-plan .xs{color:var(--accent-text)}

/* ================= 2026.10.18 화면 시안 ================= */
:root{--navy:#262A4A;--lav:#F3F0FF;--lav2:#E9E4FF}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--navy:#C8BCFF;--lav:#231F3A;--lav2:#2E2850}}
:root[data-theme="dark"]{--navy:#C8BCFF;--lav:#231F3A;--lav2:#2E2850}
body{background:var(--surface)}
.top{background:color-mix(in srgb,var(--surface) 92%,transparent);min-height:62px}
.brand{font-size:20px;font-weight:850;letter-spacing:-.6px;gap:8px;color:var(--fg)}
.brand-mc.v3-boat{width:30px;height:24px;margin:0;color:var(--navy);overflow:visible}
.brand-mc.v3-boat svg{width:30px;height:24px}
.save-state{display:none}
.v3-me{width:44px;height:44px;border-radius:14px;border:0;padding:0;cursor:pointer;background:var(--lav);box-shadow:inset 0 0 0 1.5px var(--line);display:inline-flex;align-items:flex-end;justify-content:center;overflow:hidden}
.v3-me .px{width:34px;height:34px}
.card{box-shadow:none;border:1.5px solid var(--line)}
.card.dashed,.card.soft,.card.warn{border:0}
#app{gap:16px}

/* 제목 줄 */
.v3-title{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:2px}
.v3-title h1{font-size:34px;letter-spacing:-1.4px;line-height:1.15}
.v3-date{font-size:17px;color:var(--fg);font-weight:600}
.v3-ic{width:44px;height:44px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);display:inline-grid;place-items:center;cursor:pointer;padding:0;flex-shrink:0}
.v3-ic svg{width:24px;height:24px}
.v3-ic.plain{border:0}
.v3-mo{display:inline-flex;align-items:center;gap:8px;border:0;background:transparent;color:var(--muted);font:600 15px var(--font);cursor:pointer;padding:6px 4px 6px 10px;border-left:1.5px solid transparent}
.v3-mo svg{width:26px;height:26px;color:var(--fg)}

/* 오늘: 주 띠 */
.v3-strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.v3-day{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:transparent;cursor:pointer;font:inherit;color:var(--muted);padding:0}
.v3-day span{font-size:13px;font-weight:600}
.v3-day b{width:100%;max-width:46px;height:44px;display:grid;place-items:center;border-radius:12px;border:1.5px solid var(--line);font-size:17px;color:var(--fg);font-weight:600;background:var(--surface)}
.v3-day.on b{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:800}
.v3-day.pst b{color:var(--muted)}

/* 지금 카드 */
.v3-now{display:flex;align-items:center;gap:14px;padding:14px;border-radius:20px;background:var(--lav);border:1.5px solid var(--lav2);position:relative}
.v3-port{width:92px;height:92px;flex-shrink:0;border-radius:18px;background:var(--surface);border:1.5px solid var(--line);display:flex;align-items:flex-start;justify-content:center;overflow:hidden}
.v3-port .px{width:88px;height:96px;margin-top:-2px}
.v3-now-m{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.v3-now-tag{font-size:13px;font-weight:800;color:var(--accent-text)}
.v3-now-t{font-size:19px;letter-spacing:-.5px;line-height:1.3;color:var(--fg)}
.v3-now-meta{font-size:14px;color:var(--fg);opacity:.85}
.v3-now-l{font-size:13.5px;color:var(--muted);line-height:1.45}
.v3-now-alt{font-size:13px;align-self:flex-start;min-height:30px;padding:0}
.v3-now-b{flex-shrink:0;align-self:center;min-height:48px;padding:0 20px;border-radius:12px}

/* 하루 목록 */
.v3-list{display:flex;flex-direction:column;position:relative}
.v3-list:before{content:"";position:absolute;left:74px;top:22px;bottom:22px;width:2px;background:var(--line)}
.v3-row{display:grid;grid-template-columns:56px 36px 1fr 28px;align-items:center;min-height:64px;border-bottom:1px solid var(--line);position:relative}
.v3-row:last-child{border-bottom:0}
.v3-t{font-size:15px;color:var(--fg);font-weight:500;padding-left:2px}
.v3-node{width:24px;height:24px;border-radius:50%;justify-self:center;position:relative;z-index:1;display:grid;place-items:center;padding:0;border:0;background:var(--surface)}
.v3-node svg{width:15px;height:15px}
.v3-node.ck{cursor:pointer;box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--accent) 55%,var(--line));color:#fff}
.v3-node.ck.on{background:var(--ok);box-shadow:none}
.v3-node.ck.now{box-shadow:inset 0 0 0 2px var(--accent),inset 0 0 0 7px var(--surface),inset 0 0 0 12px var(--accent)}
.v3-node.dot{background:hsl(var(--h,250) 55% 82%);box-shadow:0 0 0 3px var(--surface)}
.v3-node.dot.k-event{background:color-mix(in srgb,var(--k-event) 60%,#fff)}
.v3-node.dot.k-rest{background:color-mix(in srgb,var(--sun) 70%,#fff)}
.v3-row.v3-fxrow .v3-node.dot{background:hsl(var(--h,250) 50% 78%)}
.v3-node.v3-ngap{background:var(--surface);border:2px dashed var(--muted)}
.v3-node.v3-ngap:after{content:"";position:absolute;inset:0;border-radius:50%;border:2px dashed var(--muted);opacity:.0}
.v3-m{display:flex;flex-direction:column;align-items:flex-start;gap:1px;border:0;background:transparent;text-align:left;font:inherit;color:var(--fg);cursor:pointer;padding:10px 4px 10px 6px;min-width:0}
.v3-m b{font-size:17px;font-weight:750;letter-spacing:-.3px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.v3-m span{font-size:14px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.v3-chev{color:var(--muted);display:inline-grid;place-items:center}
.v3-chev svg{width:18px;height:18px}
.v3-row.cur{background:var(--lav);border-radius:14px;border-bottom-color:transparent}
.v3-row.cur:before{content:"";position:absolute;left:-6px;top:6px;bottom:6px;width:4px;border-radius:3px;background:var(--accent)}
.v3-row.st-done .v3-m b{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1.5px}
.v3-row.st-miss .v3-m b,.v3-row.sk .v3-m b{color:var(--muted)}
.v3-row.v3-gaprow{min-height:56px}
.v3-gap{font-size:15px!important;color:var(--fg)!important}
.v3-add{width:34px;height:34px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);display:grid;place-items:center;cursor:pointer;padding:0;justify-self:end}
.v3-add svg{width:18px;height:18px}
.v3-row.v3-gaprow{grid-template-columns:56px 36px 1fr 38px}
.v3-empty{padding:16px;text-align:center;border:1.5px dashed var(--line);border-radius:16px}
.v3-sub{margin-top:4px}
.v3-day-sec .ad-row{margin:0}

/* 길잡이 넛지 */
.v3-nudge{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;background:var(--lav);border:0;border-left:4px solid var(--accent);width:100%;text-align:left;font:inherit;color:var(--fg)}
.v3-nudge .grow{display:flex;flex-direction:column;gap:1px;min-width:0}
.v3-nudge b{font-size:16.5px;letter-spacing:-.3px;line-height:1.35}
.v3-g{width:50px;height:50px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line);display:inline-flex;align-items:flex-end;justify-content:center;overflow:hidden;flex-shrink:0}
.v3-g.big{width:60px;height:60px;align-items:flex-start}
.v3-g.big .px{width:44px}
.v3-nb{border-radius:12px;box-shadow:inset 0 0 0 1.5px var(--accent)!important;color:var(--accent-text);background:var(--surface);white-space:nowrap}
.v3-nudge-btn{cursor:pointer;border-left:0;border:1.5px solid var(--lav2)}

/* FAB */
.fab{width:56px;height:56px;border-radius:16px;background:var(--navy);color:var(--surface);box-shadow:0 8px 20px rgba(20,22,50,.28);font-size:30px}
body.g-tab .fab{display:none}

/* 이번 주 */
.v3-wnav{display:flex;align-items:center;justify-content:center;gap:24px;margin-top:-6px}
.v3-wnav b{font-size:18px;font-weight:650;letter-spacing:-.3px}
.v3-arr{width:40px;height:40px;border:0;background:transparent;font-size:26px;color:var(--fg);cursor:pointer;border-radius:12px}
.v3-back{align-self:center;margin-top:-10px}
.v3-card{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:6px}
.v3-wk{padding:12px 10px 8px}
.v3-wdays{display:grid;grid-template-columns:28px repeat(7,minmax(0,1fr));gap:2px;margin-bottom:6px}
.v3-wdays:before{content:""}
.v3-wd{display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:transparent;cursor:pointer;font:inherit;color:var(--muted);padding:4px 0;border-radius:12px}
.v3-wd span{font-size:13px;font-weight:650}
.v3-wd b{font-size:18px;color:var(--fg);font-weight:600}
.v3-wd.on{background:var(--accent);color:#fff}.v3-wd.on b{color:#fff;font-weight:800}
.v3-wd.td:not(.on) b{color:var(--accent)}
.v3g-scroll{max-height:330px;overflow-y:auto;overscroll-behavior:contain;border-top:1px solid var(--line)}
.v3g-body{position:relative;display:grid;grid-template-columns:28px 1fr}
.v3g-axis{position:relative}
.v3g-axis span{position:absolute;left:0;font-size:12px;color:var(--muted);transform:translateY(-1px)}
.v3g-cols{position:relative;display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.v3g-ln{position:absolute;left:0;right:0;height:1px;background:var(--line);pointer-events:none}
.v3g-col{position:relative;border:0;border-left:1px solid var(--line);background:transparent;padding:0;cursor:pointer;min-height:100%}
.v3g-col.sel{background:color-mix(in srgb,var(--accent) 5%,transparent)}
.v3g-b{position:absolute;left:2px;right:2px;border-radius:6px;padding:3px 3px 2px 5px;overflow:hidden;text-align:left;display:flex;flex-direction:column;gap:1px;
  background:hsl(var(--h,250) 70% 95%);box-shadow:inset 3px 0 0 hsl(var(--h,250) 55% 72%);color:#2A2C4A}
.v3g-b b{font-size:11px;font-weight:750;line-height:1.2;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.v3g-b small{font-size:9.5px;line-height:1.2;color:#5D6080}
.v3g-b.k-deep{background:#ECE8FF;box-shadow:inset 3px 0 0 #A898FF}
.v3g-b.k-out{background:#E3F6EF;box-shadow:inset 3px 0 0 #7FD3B4}

<script>
(function(){
'use strict';

/* ---------- helpers ---------- */

const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fromIso=s=>{const p=String(s).split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const today=()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate());};
const mondayOf=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x;};
const dow=d=>(d.getDay()+6)%7;
const hm=m=>pad(Math.floor(m/60)%24)+':'+pad(m%60);
const parseHm=s=>{const m=/^(\d{1,2}):(\d{2})$/.exec(String(s||''));return m?Number(m[1])*60+Number(m[2]):null;};
const md=d=>(d.getMonth()+1)+'.'+d.getDate();

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);

const curKey=()=>iso(mondayOf(today()));
const planKey=()=>dow(today())===6?iso(addDays(mondayOf(today()),7)):curKey();
const weekDayIndex=(key,dateIso)=>Math.round((fromIso(dateIso)-fromIso(key))/864e5);

/* ---------- profile options ---------- */
const OPT={

function getWeek(key){

    const keys=Object.keys(S.weeks).filter(k=>k<key).sort();

function migrate(d){

const ui={tab:'today',onb:0,busy:{},err:{},proposals:null,chat:[],chatText:'',ctl:{},sheet:null,toast:'',dayView:null,

/* ---------- storage ---------- */
const store={mode:'memory',ref:null,timer:null,ready:null,
  async init(){
    try{
      if(window.claude&&window.claude.use){
        const pair=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
        const db=pair[0],user=pair[1];
        const id=user?await user.id():null;
        if(db&&id){
          this.ref=db.doc('data/users/'+id+'/state');
          const snap=await this.ref.get();
          this.mode='db';
          return snap.exists?snap.data():null;
        }
      }
    }catch(e){}
    try{const raw=localStorage.getItem('daeum-ju-v1');this.mode='local';return raw?JSON.parse(raw):null;}
    catch(e){this.mode='memory';return null;}
  },
  save(){
    if(S.demo)return;
    clearTimeout(this.timer);
    setSaveState('저장 중');
    this.timer=setTimeout(async()=>{
      await this.ready;
      pruneWeeks();
      const data=clone(S);
      try{
        if(this.mode==='db'&&this.ref)await this.ref.set(data);
        else if(this.mode==='local')localStorage.setItem('daeum-ju-v1',JSON.stringify(data));
        setSaveState(this.mode==='memory'?'이 창에서만 유지':'저장됨');
      }catch(e){setSaveState('저장 실패 · 다시 시도할게요');}

  },

    try{
      if(this.mode==='db'&&this.ref)await this.ref.delete();

function commit(){store.save();render();}
function toast(t){ui.toast=t;renderOverlay();clearTimeout(toast.tm);toast.tm=setTimeout(()=>{ui.toast='';renderOverlay();},2600);}

/* ---------- personal setup from profile ---------- */
function fallbackSetup(){
  const p=S.profile,rec=[];
  if(S.month.goal&&!(S.month.plan&&S.month.plan.applied))goalPlanLocal(S.month.goal,S.month.target,S.month.unit).items.slice(0,2).forEach(x=>rec.push(Object.assign({goal:true},x)));
  const ex=p.exercise==='주 3회 이상'?3:p.exercise==='주 1–2회'?2:1;
  const has=k=>p.interests.includes(k);
  if(has('운동')||p.exercise)rec.push({name:'운동',count:ex,minutes:60,kind:'light',pref:'evening',guard:true});
  if(has('공부')||has('커리어')||/학생|수험|취업/.test(p.role||''))rec.push({name:'깊은 일 50분',count:3,minutes:50,kind:'deep',pref:'focus',guard:!rec.some(r=>r.guard)});
  if(has('독서'))rec.push({name:'독서',count:2,minutes:30,kind:'light',pref:'evening',guard:false});
  if(has('관계'))rec.push({name:'친구·가족 연락',count:1,minutes:20,kind:'light',pref:'evening',guard:false});
  if(has('마음 건강'))rec.push({name:'산책이나 명상',count:3,minutes:15,kind:'light',pref:'any',guard:false});
  if(has('돈 관리'))rec.push({name:'가계부 정리',count:1,minutes:20,kind:'light',pref:'any',guard:false});
  if(has('창작'))rec.push({name:'창작 블록',count:2,minutes:60,kind:'deep',pref:'focus',guard:false});
  if(!rec.length)rec.push({name:'깊은 일 50분',count:3,minutes:50,kind:'deep',pref:'focus',guard:true});
  let buffer=0.3;
  if(p.patterns.includes('계획을 너무 많이 잡는다'))buffer=0.4;
  if(p.patterns.includes('피곤하면 다 놓는다'))buffer=Math.max(buffer,0.35);
  const calib={deep:p.patterns.includes('시작이 늦다')?1.4:1.3,light:1,out:1.1};
  const tips=[];
  if(p.patterns.includes('관심이 자주 바뀐다'))tips.push('새 아이디어는 바로 시작하지 말고 냉각함에 넣어 두세요. 일요일에 다시 물어볼게요.');
  if(p.patterns.includes('계획을 너무 많이 잡는다'))tips.push('버퍼를 40%로 잡았어요. 넘치면 하나만 고르게 할게요.');
  if(p.patterns.includes('시작이 늦다'))tips.push('블록마다 2분짜리 첫 행동을 붙여 드려요. 그것만 해도 시작한 거예요.');
  if(p.patterns.includes('피곤하면 다 놓는다'))tips.push('무너지는 날엔 최소 행동 하나만 지켜도 경험치를 드려요.');
  if(p.patterns.includes('시험·마감 때 무너진다'))tips.push('시험 기간엔 오늘 탭의 시즌 모드를 켜세요. 계획이 가벼워지고 연속 기록은 지켜져요.');
  if(p.patterns.includes('남과 비교하며 지친다'))tips.push('경험치 숫자는 작게 두고, 지난주의 나와만 비교해 보여 드릴게요.');
  while(tips.length<3)tips.push(['일요일 15분이면 다음 주가 정리돼요.','하루 마감은 30초면 끝나요. 밀린 건 제가 다시 짜요.','빠졌다 돌아온 주엔 보너스 경험치가 있어요.'][tips.length]);
  const who=[p.age,p.role].filter(Boolean).join(' ');
  return {summary:(who?who+'이고, ':'')+'하루는 '+p.wake+'에 시작해 '+p.sleep+'쯤 끝나요. 집중은 '+(OPT.focus.find(f=>f[0]===p.focus)||['','오후'])[1]+'에 잘 된다고 했어요.',
    recurring:rec.filter((x,i)=>!(x.name==='운동'&&rec.some(y=>y.goal&&/운동/.test(y.name)))).slice(0,5),buffer,calib,floor:has('운동')?'운동복 입고 10분 걷기':'할 일 하나를 10분만 하기',tips:tips.slice(0,3)};
}
async function aiSetup(){
  const prompt=[
    "너는 자기관리 앱 '다음 주'의 길잡이다. 새 사용자의 프로필을 보고 첫 설정을 JSON 하나로만 제안하라.",
    '{"summary":"이 사람의 생활과 패턴을 관찰로 요약한 2문장","recurring":[{"name":"반복 목표 이름","count":3,"minutes":50,"kind":"deep|light|out","pref":"morning|afternoon|evening|night|focus|any","guard":true}],"buffer":0.3,"calib":{"deep":1.3,"light":1.0,"out":1.1},"floor":"무너져도 지킬 최소 행동 하나","tips":["이 사람의 패턴에 맞춘 앱 사용 팁"]}',
    '규칙:',
    '- monthGoalPlan이 있으면 그 행동들은 이미 정해졌으니 recurring에 넣지 말고 나머지 생활 영역만 1~3개 제안한다. monthGoalPlan이 없고 monthGoal이 있으면, 목표 수치에서 역산한 구체적 행동(예: 3kg 감량 → 운동 주 4회 50분)을 첫 recurring으로 넣는다.',
    '- recurring는 3~5개. 관심 영역과 운동 습관을 반영하고, 처음엔 지금 수준보다 아주 조금만 높게 잡는다(작은 성공부터). guard(지키는 선)는 1~2개.',
    '- 계획을 많이 잡는 패턴이면 buffer를 0.35~0.45로, 아니면 0.25~0.35로. 시작이 늦은 패턴이면 calib.deep을 1.4 이상으로.',
    '- tips는 3개. 앱 기능(냉각함, 시즌 모드, 하루 마감, 최소 행동, 만약-그러면 한 줄, 경험치)을 이 사람의 패턴에 연결해 말한다.',
    '- 나이와 성별은 고정관념으로 쓰지 않고, 생활 리듬과 상황을 짐작하는 데만 참고한다.',
    '- summary는 평가 없이 관찰만. '+toneRule()+' 한국어 존댓말.',
    '프로필: '+JSON.stringify(Object.assign(profileCtx(),{fixedSchedule:S.setup.fixed.map(f=>({day:DAYS[f.dow],from:hm(f.start),to:hm(f.end),label:f.label})),monthGoal:S.month.goal?S.month.goal+' ('+S.month.target+S.month.unit+')':null,monthGoalPlan:S.month.plan&&S.month.plan.applied?S.month.plan.items.filter(x=>x.on!==false).map(x=>x.name+' 주'+x.count+'회'):null}))
  ].join('\n');
  return runAI('setup',(sample,signal)=>sample.json(prompt,{signal,cache:false}));
}
function normalizeSetup(res){
  const kinds=['deep','light','out'],prefs=['morning','afternoon','evening','night','focus','any'];
  const recurring=(Array.isArray(res.recurring)?res.recurring:[]).slice(0,6).map(r=>({name:String(r.name||'').slice(0,30),
    count:clamp(Math.round(Number(r.count)||1),1,7),minutes:clamp(Math.round((Number(r.minutes)||30)/10)*10,10,180),
    kind:kinds.includes(r.kind)?r.kind:'light',pref:prefs.includes(r.pref)?r.pref:'any',guard:!!r.guard})).filter(r=>r.name);
  const c=res.calib||{};
  return {summary:String(res.summary||'').slice(0,240),recurring:recurring.length?recurring:fallbackSetup().recurring,
    buffer:clamp(Number(res.buffer)||0.3,0.2,0.45),
    calib:{deep:clamp(Number(c.deep)||1.3,1,1.8),light:clamp(Number(c.light)||1,1,1.4),out:clamp(Number(c.out)||1.1,1,1.5)},
    floor:String(res.floor||'').slice(0,60),tips:(Array.isArray(res.tips)?res.tips:[]).map(String).slice(0,3)};
}
function applySetupResult(r){
  S.profile.summary=r.summary;S.profile.tips=r.tips;
  S.baseRecurring=r.recurring.map(x=>Object.assign({id:uid(),unit:x.kind==='deep'?'블록':'회',detail:'',bundle:'',open:false},x));
  if(S.month.plan&&S.month.plan.applied)S.baseRecurring=mergeGoalRec(S.baseRecurring).slice(0,6);
  S.buffer=Math.round(r.buffer*100)/100;
  S.calib={deep:Math.round(r.calib.deep*10)/10,light:Math.round(r.calib.light*10)/10,out:Math.round(r.calib.out*10)/10};
  S.baseFloor=r.floor;
  if(S.profile.patterns.includes('남과 비교하며 지친다'))S.profile.showXP=false;
  const k=planKey();
  if(S.weeks[k]&&!S.weeks[k].confirmed&&!S.weeks[k].blocks.length)delete S.weeks[k];
}

/* ---------- allocation engine ---------- */
function windowFor(pref){
  const s=S.setup;
  const w={morning:[s.dayStart,720],afternoon:[780,1080],evening:[1080,Math.min(s.dayEnd,1290)],night:[1260,s.dayEnd]};
  if(pref==='focus')return w[s.focus]||w.afternoon;
  return w[pref]||[s.dayStart,s.dayEnd];
}
function fits(day,start,dur,blocks,skipId){
  const s=S.setup;
  if(start<s.dayStart||start+dur>s.dayEnd)return false;
  for(const iv of busyFor(day,blocks,skipId))if(start<iv[1]+10&&start+dur+10>iv[0])return false;
  return true;
}
function findSlot(day,dur,pref,blocks,minStart,skipId){
  const tryWin=w=>{
    let t=Math.ceil(Math.max(w[0],minStart||0)/10)*10;
    for(;t+dur<=w[1];t+=10)if(fits(day,t,dur,blocks,skipId))return t;
    return -1;
  };
  let r=tryWin(windowFor(pref));
  if(r<0)r=tryWin([S.setup.dayStart,S.setup.dayEnd]);
  return r;
}
function allocate(wk,buffer,opt){
  opt=opt||{};
  const isCur=wk.key===curKey();
  const t0=opt.fromDay!=null?opt.fromDay:(isCur?dow(today()):0);
  const blocks=wk.blocks.filter(b=>b.pinned||b.done).map(b=>Object.assign({},b));
  const cap=[],used=[],deep=[];
  for(let d=0;d<7;d++){
    cap[d]=d<t0?0:dayCapacity(d,buffer);
    used[d]=blocks.filter(b=>b.day===d).reduce((a,b)=>a+b.dur,0);
    deep[d]=blocks.filter(b=>b.day===d&&b.kind==='deep').length;
  }
  const overflow=[];
  const minFor=d=>(isCur&&!opt.ignoreNow&&d===dow(today()))?nowMin()+30:0;
  const range=(a,b)=>{const r=[];for(let i=a;i<=b;i++)r.push(i);return r;};
  function tryPlace(item,d,reason){
    if(d<t0||d>6)return false;
    if(item.dur>0&&used[d]+item.dur>cap[d])return false;
    if(item.kind==='deep'&&deep[d]>=3)return false;
    const st=item.dur>0?findSlot(d,item.dur,item.pref,blocks,minFor(d)):findSlot(d,60,'evening',blocks,minFor(d));
    if(st<0)return false;
    blocks.push({id:uid(),day:d,start:st,dur:item.dur,title:item.title,kind:item.kind,src:item.src,refId:item.refId,
      deadline:item.deadline||null,reason,ifthen:'',pinned:false,done:false,hold:item.dur===0});
    used[d]+=item.dur;if(item.kind==='deep')deep[d]++;
    return true;
  }
  function placeAny(item,days,reason){
    for(const d of days)if(tryPlace(item,d,reason))return true;
    overflow.push({title:item.title,dur:item.dur,src:item.src,refId:item.refId});
    return false;
  }
  const recCount=r=>S.season?Math.min(r.count,1):r.count;
  const spread=n=>{const a=[];for(let i=0;i<n;i++)a.push(Math.min(6,Math.floor(i*7/n)));return a;};
  function placeRec(r){
    const n=recCount(r);
    let need=n-blocks.filter(b=>b.refId===r.id).length;if(need<=0)return;
    const title=r.name+(r.detail?' · '+r.detail:'');
    const reason=r.guard?'지키는 선이라 가장 먼저 잡았어요':'주 '+n+'회를 고르게 나눴어요 · 같은 시간대 우선';
    const tried=new Set();
    for(const d of [...spread(n),...range(0,6)]){
      if(need<=0)break;
      if(tried.has(d))continue;tried.add(d);
      if(blocks.some(b=>b.day===d&&b.refId===r.id))continue;
      if(tryPlace({title,dur:r.minutes,kind:r.kind,pref:r.pref,src:'rec',refId:r.id},d,reason))need--;
    }
    for(let i=0;i<need;i++)overflow.push({title:r.name,dur:r.minutes,src:'rec',refId:r.id});
  }
  const recs=wk.recurring.filter(r=>r.count>0);
  recs.filter(r=>r.guard).forEach(placeRec);
  const cards=wk.cards.filter(c=>c.on!==false).map(c=>Object.assign({},c,{sug:false}))
    .concat(wk.suggestions.filter(s=>s.accepted).map(s=>Object.assign({},s,{sug:true,must:false,goal:s.type==='goal',deadline:null})));
  const prio=c=>c.must?0:c.goal?1:c.sug?2:3;
  cards.sort((a,b)=>prio(a)-prio(b)||String(a.deadline||'9').localeCompare(String(b.deadline||'9')));
  for(const c of cards){
    const minutes=Math.round((Number(c.minutes)||0)*(S.calib[c.kind]||1)/10)*10;
    let parts;
    if(minutes===0)parts=[{dur:0,label:''}];
    else if(c.kind==='deep'&&minutes>75){const n=Math.max(2,Math.round(minutes/50));parts=Array.from({length:n},(_,i)=>({dur:50,label:' '+(i+1)+'/'+n}));}
    else parts=[{dur:Math.max(20,minutes),label:''}];
    parts=parts.slice(blocks.filter(b=>b.refId===c.id).length);
    let last=6,reason;
    const dl=c.deadline?weekDayIndex(wk.key,c.deadline):null;
    if(dl!=null){
      last=clamp(dl-1,t0,6);if(dl-1<t0)last=clamp(dl,t0,6);
      reason=(dl>=0&&dl<=6?DAYS[dl]+'요일':'마감')+' 하루 전까지 끝나도록 앞에서부터 깔았어요';
    }else reason=c.goal?'이번 달 목표와 연결된 일이에요':c.sug?'추가한 제안이에요':'남는 시간에 넣었어요';
    if(c.kind==='deep')reason+=' · 집중이 잘 되는 시간대';
    if(minutes===0)reason='계획 없이 비워 두는 저녁이에요';
    const pref=c.kind==='deep'?'focus':c.kind==='out'?'afternoon':'any';
    const days=minutes===0?range(t0,Math.max(t0,5)).reverse():range(t0,last);
    for(const p of parts)placeAny({title:c.title+p.label,dur:p.dur,kind:c.kind,pref,src:c.sug?'sug':'card',refId:c.id,deadline:c.deadline},days,reason);
  }
  recs.filter(r=>!r.guard).forEach(placeRec);
  blocks.sort((a,b)=>a.day-b.day||a.start-b.start);
  for(const b of blocks)if(!b.ifthen)b.ifthen=templateIfThen(b);
  let available=0,placed=0;
  for(let d=0;d<7;d++){available+=cap[d];placed+=used[d];}
  return {blocks,overflow,available:Math.round(available),placed:Math.round(placed)};
}
function templateIfThen(b){
  const t=b.title;let step='타이머 10분을 켠다';
  if(/헬스|운동|러닝|요가|걷/.test(t))step='운동복부터 입는다';
  else if(/독서|읽기|책/.test(t))step='책을 펴고 한 쪽만 읽는다';
  else if(/전화|연락/.test(t))step='연락처를 열어 둔다';
  else if(/명상|산책/.test(t))step='휴대폰을 내려놓고 밖으로 나간다';
  else if(b.kind==='deep')step='파일을 열고 첫 문장만 쓴다';
  else if(b.kind==='out')step='나갈 준비물부터 챙긴다';
  else if(b.kind==='rest')step='휴대폰을 내려놓는다';
  if(b.hold)return '저녁이 오면 → 아무것도 잡지 않고 쉰다';

}

function risks(wk){

function weekXP(wk){
  const items=[];if(!wk)return {items,sum:0};
  if(wk.confirmed)items.push(['일요일 정리',50]);
  if(wk.confirmed&&wk.comeback)items.push(['다시 돌아온 주',40]);
  const done=wk.blocks.filter(b=>b.done);
  for(const r of wk.recurring.filter(r=>r.guard&&r.count>0)){
    const n=done.filter(b=>b.refId===r.id).length;
    if(n>=(S.season?1:r.count))items.push(['지키는 선 · '+r.name+' '+n+'/'+r.count,15]);
  }
  const fl=Object.keys(wk.floorDone||{}).length;
  if(fl)items.push(['최소 행동 '+fl+'일',Math.min(35,fl*5)]);
  const nb=done.filter(b=>b.src!=='sug'&&b.src!=='rest'&&b.kind!=='event'&&b.dur>0).length;
  if(nb)items.push(['해낸 블록 '+nb+'개 (주당 60까지)',Math.min(60,nb*5)]);
  const ns=done.filter(b=>b.src==='sug').length;
  if(ns)items.push(['길잡이 제안 실천 '+ns+'개',ns*10]);
  if(wk.accepted)items.push(['다시 배치 받아들임 '+wk.accepted+'번',Math.min(20,wk.accepted*5)]);
  if(wk.resultLogged)items.push(['이번 달 결과 기록',20]);
  return {items,sum:items.reduce((a,b)=>a+b[1],0)};
}
function totalXP(){return S.xpBank+Object.values(S.weeks).reduce((a,w)=>a+weekXP(w).sum,0);}
function levelInfo(){const t=totalXP();return {total:t,lv:Math.floor(t/300)+1,into:t%300};}
function streakInfo(){
  const set=new Set(S.streak.weeks);const prot=S.streak.protect||{};
  let k=set.has(curKey())?curKey():iso(addDays(fromIso(curKey()),-7));
  let n=0;const dots=[];const used={};
  for(let i=0;i<26;i++){
    const mk=k.slice(0,7);
    if(set.has(k)){n++;dots.push('on');}
    else if(prot[k])dots.push('frz');
    else if(n>0&&!used[mk]){used[mk]=true;dots.push('frz');}
    else break;
    k=iso(addDays(fromIso(k),-7));
  }
  const four=dots.slice(0,4);while(four.length<4)four.push('');
  return {n,dots:four.reverse(),freezeLeft:used[monthKey(today())]?0:1};
}
function feedbackLine(wk){

  const guards=wk.recurring.filter(r=>r.guard&&r.count>0);
  const met=guards.filter(r=>wk.blocks.filter(b=>b.done&&b.refId===r.id).length>=(S.season?1:r.count)).length;
  const fl=Object.keys(wk.floorDone||{}).length;

function durLabel(m){m=Math.max(0,Math.round(m));if(m<60)return m+'분';return Math.floor(m/60)+'시간'+(m%60?' '+m%60+'분':'');}
function bigLeft(m,tail){return m<100?'<span class="mono big">'+m+'</span><span>분 '+tail+'</span>':'<span class="mono big">'+Math.floor(m/60)+':'+pad(m%60)+'</span><span>'+tail+'</span>';}

function dayRange(){const s=S.setup;return [Math.max(0,Math.floor((s.dayStart-60)/60)*60),Math.min(1440,Math.ceil((s.dayEnd+30)/60)*60)];}
function modeFor(wk,d){
  const ck=curKey();if(wk.key>ck)return 'future';if(wk.key<ck)return 'past';
  const t=dow(today());return d<t?'past':d===t?'today':'future';
}
function blockState(b,mode){
  if(b.done)return 'done';if(mode==='past')return 'miss';if(mode==='future')return 'up';
  const n=nowMin();if(n>=b.start+b.dur)return 'miss';if(n>=b.start)return 'now';return 'up';
}
function isGuard(wk,b){return b.src==='rec'&&wk.recurring.some(r=>r.id===b.refId&&r.guard);}
function findSlotLoose(wk,day,dur,minStart,skipId){
  for(let t=Math.ceil(minStart/10)*10;t+dur<=S.setup.dayEnd;t+=10)if(fitsLoose(wk,day,t,dur,skipId))return t;

function kindOf(wk,o){
  const c=wk.cards.find(x=>x.id===o.refId);if(c)return c.kind;
  const s=wk.suggestions.find(x=>x.id===o.refId);if(s)return s.kind;

function gapCands(wk){
  const out=[];
  for(const r of wk.recurring.filter(r=>r.count>0)){
    const need=S.season?Math.min(r.count,1):r.count;
    const placed=wk.blocks.filter(b=>b.refId===r.id).length,done=wk.blocks.filter(b=>b.refId===r.id&&b.done).length;
    if(placed<need)out.push({title:r.name+(r.detail?' · '+r.detail:''),dur:r.minutes,kind:r.kind,src:'rec',refId:r.id,why:'이번 주 '+done+'/'+need+(r.guard?' · 지키는 선':''),prio:r.guard?0:2});

  (wk.deferred||[]).forEach((o,i)=>{if(o.dur>0&&o.src!=='rec')out.push({title:o.title,dur:o.dur,kind:kindOf(wk,o),src:o.src,refId:o.refId,why:'다음 주로 넘겨 둔 일',from:'deferred',idx:i,prio:3});});

  return out.slice(0,6);

function blkAct(a,d){

      break;}

    case 'blk-later':{const st=findSlotLoose(wk,b.day,b.dur,Math.max(n+10,b.start+10),b.id);
      if(st>=0){b.start=st;moved();ui.sheet=null;toast(hm(st)+'로 옮겼어요');}else toast('오늘은 남은 자리가 없어요. 다른 날로 옮겨 보세요');break;}
    case 'blk-otherday':{const isCur=wk.key===curKey();let to=null;
      for(let dd=b.day+1;dd<=6&&!to;dd++){const st=findSlot(dd,b.dur,prefOf(b),wk.blocks,(isCur&&dd===dow(today()))?n+30:0,b.id);if(st>=0)to={day:dd,start:st};}
      if(to){b.day=to.day;b.start=to.start;b.reason='직접 다른 날로 옮겼어요';moved();toast(DAYS[to.day]+'요일 '+hm(to.start)+'로 옮겼어요');}

      ui.sheet=null;break;}
    case 'blk-pin':b.pinned=!b.pinned;break;
    case 'blk-remove':wk.blocks=wk.blocks.filter(x=>x.id!==b.id);
      if(b.src!=='rest'&&!b.goalId&&b.kind!=='event')wk.overflow.push({title:b.title,dur:b.dur,src:b.src,refId:b.refId});

function goalPlanLocal(goal,target,unit){
  const g=String(goal||'')+' '+(target||'')+(unit||'');const out=[];let note='';
  const kg=/(\d+(?:\.\d+)?)\s*(kg|킬로)/i.exec(g);
  if(/감량|다이어트|살\s*빼|kg|킬로|체중|체지방/i.test(g)){
    const n=kg?Number(kg[1]):3;
    note='한 달 '+n+'kg면 주 '+(Math.round(n/4.3*10)/10)+'kg 페이스예요.'+(n>4?' 빠른 편이라 식단 조절이 꼭 함께 가야 해요.':' 무리 없는 속도예요.');
    out.push({name:'운동 (근력+유산소)',count:n>=4?5:4,minutes:50,kind:'light',pref:'evening',guard:true,why:'감량엔 주 4회 이상, 회당 40분 넘는 운동이 기준이에요.'});
    out.push({name:'식단 기록',count:7,minutes:10,kind:'light',pref:'evening',guard:false,why:'체중은 먹는 양 영향이 커서 매일 짧게 적어요.'});
    out.push({name:'걷기',count:3,minutes:30,kind:'light',pref:'any',guard:false,why:'운동 없는 날의 활동량을 채워요.'});
  }else if(/토익|토플|오픽|텝스|영어|점수|자격증|시험|공무원|모의고사/.test(g)){
    note='점수 목표는 매일 조금씩 문제를 푸는 횟수가 결과를 좌우해요.';
    out.push({name:'문제 풀이 50분',count:5,minutes:50,kind:'deep',pref:'focus',guard:true,why:'실전 감각은 주 5회 이상 풀어야 유지돼요.'});
    out.push({name:'단어·오답 정리',count:6,minutes:20,kind:'light',pref:'any',guard:false,why:'짧게 자주 해야 기억에 남아요.'});
  }else if(/포트폴리오|프로젝트|앱|개발|출시|만들|원고|논문|글|작품/.test(g)){
    note='만드는 목표는 긴 덩어리 시간이 몇 번 확보되느냐가 관건이에요.';
    out.push({name:'작업 블록 90분',count:4,minutes:90,kind:'deep',pref:'focus',guard:true,why:'90분은 있어야 한 단계씩 끝낼 수 있어요.'});
    out.push({name:'진행 정리',count:2,minutes:15,kind:'light',pref:'evening',guard:false,why:'어디까지 왔는지 적어 두면 다음 블록 시작이 빨라져요.'});
  }else if(/책|독서|권/.test(g)){
    const n=Number(target)||4;note='한 달 '+n+'권이면 주 '+(Math.round(n/4.3*10)/10)+'권이에요.';
    out.push({name:'독서',count:Math.min(7,Math.max(3,Math.round(n*1.5))),minutes:40,kind:'light',pref:'evening',guard:true,why:'한 권에 4~5시간이면 이 정도 횟수가 필요해요.'});
  }else if(/모으|모집|사용자|고객|인터뷰|팔로워|구독|영업/.test(g)){
    note='사람을 모으는 목표는 연락 횟수가 곧 결과예요.';
    out.push({name:'연락·홍보 블록',count:4,minutes:40,kind:'light',pref:'afternoon',guard:true,why:'주 4번은 새 사람에게 닿아야 해요.'});
    out.push({name:'반응 정리',count:2,minutes:20,kind:'light',pref:'evening',guard:false,why:'무엇이 먹혔는지 보고 다음 연락을 고쳐요.'});
  }else{
    note='목표를 이루는 핵심 행동 하나를 정해 주 3번 확보해 볼게요.';
    out.push({name:'목표 작업 50분',count:3,minutes:50,kind:'deep',pref:'focus',guard:true,why:'일주일에 세 번이면 흐름이 끊기지 않아요.'});
  }
  return {note,items:out};
}

    '- 건강 목표는 안전한 범위로: 체중 감량은 주 0.5~1kg 페이스, 굶기나 극단적 식단은 제안하지 않는다. 너무 빠른 목표면 note에서 그대로 알려 준다.',
    '- 평가나 훈계 없이 사실과 숫자로. '+toneRule()+' 한국어.',
    '데이터: '+JSON.stringify({profile:profileCtx(),goal:m.goal,target:m.target+m.unit,current:m.current,daysLeft:Math.round((end-start)/864e5)+1,fixedHoursPerWeek:fixedHours,wake:S.profile.wake,sleep:S.profile.sleep})].join('\n');

function normGoalPlan(res){
  const kinds=['deep','light','out'],prefs=['morning','afternoon','evening','night','focus','any'];
  const items=(Array.isArray(res&&res.items)?res.items:[]).slice(0,4).map(x=>({name:String(x.name||'').slice(0,20),count:clamp(Math.round(Number(x.count)||3),1,14),
    minutes:clamp(Math.round((Number(x.minutes)||30)/5)*5,5,180),kind:kinds.includes(x.kind)?x.kind:'light',pref:prefs.includes(x.pref)?x.pref:'any',guard:!!x.guard,why:String(x.why||'').slice(0,90)})).filter(x=>x.name);
  return items.length?{note:String(res.note||'').slice(0,160),items}:null;
}

function mergeGoalRec(list){

}

function gpAct(a,d){
  const m=S.month;
  switch(a){
    case 'gp-make':(async()=>{
      if(!m.goal){toast('이번 달 목표를 먼저 적어 주세요');return;}
      const res=await goalPlanAI();let p=normGoalPlan(res);
      if(!p){p=goalPlanLocal(m.goal,m.target,m.unit);ui.err.gp='';}
      m.plan={note:p.note,items:p.items.map(x=>Object.assign({on:true},x)),applied:false};commit();
    })();return;
    case 'gp-cnt':{const x=m.plan&&m.plan.items[Number(d.i)];if(x){x.count=clamp(x.count+Number(d.v),1,14);m.plan.applied=false;}commit();return;}
    case 'gp-toggle':{const x=m.plan&&m.plan.items[Number(d.i)];if(x){x.on=x.on===false;m.plan.applied=false;}commit();return;}
    case 'gp-apply':{
      if(!m.plan)return;m.plan.applied=true;
      S.baseRecurring=mergeGoalRec(S.baseRecurring||defaultRecurring());
      const wk=getWeek(planKey());wk.recurring=mergeGoalRec(wk.recurring);
      toast(wk.blocks.length?'반복 목표에 넣었어요. 다시 배분하면 블록으로 깔려요':'반복 목표에 넣었어요');commit();return;}
  }
}

/* paint by dragging */
let paint=null;
function paintCell(c){
  if(!c||!paint)return;
  const key=c.dataset.d+'-'+c.dataset.s;if(paint.seen.has(key))return;paint.seen.add(key);
  if(paint.mode==='paint'){c.dataset.l=ui.paintLabel;c.className='on';c.style.setProperty('--c',fxColor(ui.paintLabel));}
  else{delete c.dataset.l;c.className='';c.innerHTML='';}
  paint.days.add(Number(c.dataset.d));
}
function commitPaint(){
  const before=clone(S.setup.fixed),r=dayRange();
  for(const d of paint.days){
    const cells=[...document.querySelectorAll('#pg i[data-d="'+d+'"]')];
    const keepOut=S.setup.fixed.filter(f=>f.dow===d&&(f.end<=r[0]||f.start>=r[1]));
    const next=[];let cur=null;
    for(const c of cells){const l=c.dataset.l||'',s=Number(c.dataset.s);
      if(cur&&cur.label===l&&l){cur.end=s+30;continue;}
      if(cur)next.push(cur);cur=l?{id:uid(),dow:d,start:s,end:s+30,label:l,clearAfter:false}:null;}
    if(cur)next.push(cur);
    for(const x of next)x.clearAfter=before.some(f=>f.dow===d&&f.label===x.label&&f.clearAfter);
    S.setup.fixed=S.setup.fixed.filter(f=>f.dow!==d).concat(keepOut,next);
  }
  ui.fxUndo=before;ui.fxMsg='표를 고쳤어요.';paint=null;commit();
}
document.addEventListener('pointerdown',e=>{
  const c=e.target.closest&&e.target.closest('#pg i[data-d]');if(!c)return;
  e.preventDefault();if(c.hasPointerCapture&&c.hasPointerCapture(e.pointerId))c.releasePointerCapture(e.pointerId);
  paint={mode:c.dataset.l===ui.paintLabel?'erase':'paint',seen:new Set(),days:new Set()};paintCell(c);
});
document.addEventListener('pointermove',e=>{
  if(!paint)return;const el=document.elementFromPoint(e.clientX,e.clientY);
  paintCell(el&&el.closest&&el.closest('#pg i[data-d]'));
});
document.addEventListener('pointerup',()=>{if(paint)commitPaint();});
document.addEventListener('pointercancel',()=>{if(paint)commitPaint();});

/* one line → items (local fallback parser) */
function parseFixedText(text){
  const DM={'월':0,'화':1,'수':2,'목':3,'금':4,'토':5,'일':6},out=[];
  const toMin=(h,m,mk,pm)=>{h=Number(h);m=m==='반'?30:Number(m||0);
    if(/오후|저녁|밤/.test(mk||'')&&h<12)h+=12;else if(!mk&&pm&&h<12)h+=12;else if(!mk&&!pm&&h>=1&&h<=7)h+=12;return h*60+m;};
  const TR=/(오전|오후|저녁|밤|아침)?\s*(\d{1,2})\s*(?:[:시]\s*(\d{1,2}|반)?\s*분?)?\s*(?:-|~|–|부터|에서)\s*(오전|오후|저녁|밤)?\s*(\d{1,2})\s*(?:[:시]\s*(\d{1,2}|반)?\s*분?)?\s*(?:시|까지)?/;
  for(let seg of String(text).split(/[,\n;]+|그리고/)){
    seg=' '+seg.replace(/평일/g,'월화수목금').replace(/주말/g,'토일').replace(/매일/g,'월화수목금토일')+' ';
    const days=new Set();
    seg=seg.replace(/([월화수목금토일])\s*[~\-–]\s*([월화수목금토일])(?=[\s\d]|요일)/g,(m,a,b)=>{for(let i=DM[a];i<=DM[b];i++)days.add(i);return ' ';});
    seg=seg.replace(/(^|[\s,·])([월화수목금토일]{1,7})(요일)?(?=[\s\d,·]|$)/g,(m,p,g)=>{for(const ch of g)days.add(DM[ch]);return p+' ';});
    const t=TR.exec(seg);if(!t||!days.size)continue;
    const st=toMin(t[2],t[3],t[1],false);let en=toMin(t[5],t[6],t[4]||(st>=720&&Number(t[5])<12?'오후':''),st>=720);
    if(en<=st&&en+720<=1440)en+=720;if(en<=st)continue;
    const label=seg.replace(t[0],' ').replace(/[\s·,]+/g,' ').replace(/^(에|은|는)\s|\s(에|은|는|있어|있음|있다)$/g,'').trim().slice(0,12)||'고정 일정';
    out.push({days:[...days].sort(),start:st,end:Math.min(1440,en),label});
  }
  return out;
}
function normFxItems(res){
  const DM={'월':0,'화':1,'수':2,'목':3,'금':4,'토':5,'일':6};
  return (Array.isArray(res&&res.items)?res.items:[]).map(x=>{
    const days=(Array.isArray(x.days)?x.days:[]).map(d=>DM[String(d).charAt(0)]).filter(d=>d!=null);
    const st=parseHm(x.start),en=parseHm(x.end);
    return {days,start:st,end:en,label:String(x.label||'고정 일정').slice(0,12)};
  }).filter(x=>x.days.length&&x.start!=null&&x.end!=null&&x.end>x.start).slice(0,40);
}
function applyFxItems(items,msg){
  if(!items.length)return false;
  const before=clone(S.setup.fixed);
  for(const it of items)for(const d of it.days){
    S.setup.fixed=S.setup.fixed.filter(f=>!(f.dow===d&&f.start<it.end&&f.end>it.start));
    S.setup.fixed.push({id:uid(),gid:it.gid||(it.gid='g'+uid()),dow:d,start:it.start,end:it.end,label:it.label,clearAfter:false});
  }
  ui.fxUndo=before;ui.fxMsg=msg;return true;
}
const FX_SCHEMA='{"items":[{"days":["월","수"],"start":"HH:MM","end":"HH:MM","label":"짧은 이름(12자 이내)"}]}';
async function fxFromText(text){
  let items=[];
  if(!aiOff){
    const res=await runAI('fxai',(sample,signal)=>sample.json(["사용자가 매주 반복되는 고정 일정을 한 줄로 적었다. 요일·시작·끝·이름으로 나눠 JSON으로만 답하라: "+FX_SCHEMA,
      "규칙: 24시간제 HH:MM. 오전/오후 표시가 없고 1~7시면 오후로 본다. '평일'은 월~금, '주말'은 토·일. 같은 시간대의 여러 요일은 한 item으로 묶는다. 이름이 없으면 '고정 일정'.",
      '입력: '+text].join('\n'),{signal,modelTier:'quick',cache:false}),true);
    items=normFxItems(res);
  }
  if(!items.length)items=parseFixedText(text);
  if(applyFxItems(items,items.reduce((a,x)=>a+x.days.length,0)+'칸을 넣었어요. 표에서 확인해 보세요.')){clearInput('fxText');ui.err.fxai='';}
  else ui.err.fxai='요일과 시간을 못 찾았어요. "월수금 9-12 수업"처럼 적어 주세요.';
  commit();
}
async function fxFromPhoto(file){

}

function dayList(wk,d,opts){
  const items=[];
  for(const f of S.setup.fixed.filter(f=>f.dow===d))items.push({t:f.start,h:'<div class="item fixed"><span class="time">'+hm(f.start)+'</span><div class="grow"><span class="block-title">'+esc(f.label)+' · 고정</span>'+(f.clearAfter?'<span class="why">이후엔 계획을 두지 않아요</span>':'')+'</div></div>'});
  for(const b of wk.blocks.filter(b=>b.day===d))items.push({t:b.hold?1300:b.start,h:blockRow(b,opts)});
  items.sort((a,b)=>a.t-b.t);
  return items.length?'<div class="list">'+items.map(i=>i.h).join('')+'</div>':'<p class="small muted">비어 있어요.</p>';
}

      if(!S.streak.weeks.includes(wkPlan.key))S.streak.weeks.push(wkPlan.key);
      toast('확정했어요 · +50 XP');commit();return;}
    case 'block-done':{const b=wkCur.blocks.find(x=>x.id===d.id);if(b)b.done=!b.done;commit();return;}
    case 'floor-done':{const k=iso(today());if(wkCur.floorDone[k])delete wkCur.floorDone[k];else{wkCur.floorDone[k]=true;toast('최소 행동을 지켰어요 · +5 XP');}commit();return;}
    case 'close-day':{const td=dow(today());ui.proposals=wkCur.blocks.filter(b=>b.day===td&&!b.done&&b.dur>0&&!b.lock&&b.kind!=='event'&&b.src!=='rest').map(b=>({id:b.id,to:proposeMove(wkCur,b)}));render();return;}
    case 'close-done':ui.proposals=null;render();return;
    case 'move-accept':{const p=ui.proposals&&ui.proposals.find(x=>x.id===d.id);const b=wkCur.blocks.find(x=>x.id===d.id);
      if(p&&p.to&&b){b.day=p.to.day;b.start=p.to.start;b.ifthen=templateIfThen(b);b.reason='밀려서 다시 배치했어요';wkCur.accepted++;wkCur.blocks.sort((x,y)=>x.day-y.day||x.start-y.start);}
      ui.proposals=(ui.proposals||[]).filter(x=>x.id!==d.id);commit();return;}
    case 'move-next':{const b=wkCur.blocks.find(x=>x.id===d.id);if(b){wkCur.blocks=wkCur.blocks.filter(x=>x.id!==d.id);wkCur.overflow.push({title:b.title,dur:b.dur,src:b.src,refId:b.refId});}
      ui.proposals=(ui.proposals||[]).filter(x=>x.id!==d.id);commit();return;}
    case 'season':
      if(d.v==='off')S.season=null;
      else{const L={exam:'시험',sick:'아픔',trip:'여행'};S.season={type:d.v,label:L[d.v]};S.streak.protect=S.streak.protect||{};S.streak.protect[curKey()]=true;}
      commit();return;
    case 'ask':{const v=val('askIn');if(!v||ui.busy.ask)return;clearInput('askIn');askGuide(v);return;}
    case 'm-inc':S.month.target=clamp(S.month.target+1,1,9999);commit();return;
    case 'm-dec':S.month.target=clamp(S.month.target-1,1,9999);commit();return;
    case 'm-obs':S.month.obstacle=S.month.obstacle===d.v?'':d.v;commit();return;
    case 'm-ai':refineMonth();return;
    case 'keep-add':{const v=val('keepNew');if(!v)return;S.month.keep.push(v.slice(0,30));clearInput('keepNew');commit();return;}
    case 'keep-del':S.month.keep.splice(Number(d.i),1);commit();return;
    case 'nf-preset':Object.assign(ui.newFixed,{label:d.l,start:d.s,end:d.e});render();return;
    case 'nf-day':{const i=Number(d.i),n=ui.newFixed;n.days=n.days.includes(i)?n.days.filter(x=>x!==i):n.days.concat([i]).sort();render();return;}
    case 'fixed-add':{const n=ui.newFixed;const s=parseHm(n.start),e=parseHm(n.end);
      if(!n.label.trim()){ui.err.fixed='이름을 적어 주세요.';render();return;}
      if(s==null||e==null||e<=s){ui.err.fixed='끝 시간이 시작보다 늦어야 해요.';render();return;}
      if(!n.days.length){ui.err.fixed='요일을 하나 이상 골라 주세요.';render();return;}
      ui.err.fixed='';
      for(const dd of n.days)S.setup.fixed.push({id:uid(),dow:dd,start:s,end:e,label:n.label.trim().slice(0,20),clearAfter:!!n.clearAfter});
      ui.newFixed=Object.assign({},ui.newFixed,{label:'',clearAfter:false});toast('고정 일정을 추가했어요');commit();return;}
    case 'fixed-del':{const ids=String(d.ids||'').split(',');S.setup.fixed=S.setup.fixed.filter(f=>!ids.includes(f.id));commit();return;}
    case 'cur-inc':case 'cur-dec':S.month.current=clamp(S.month.current+(a==='cur-inc'?1:-1),0,99999);wkCur.resultLogged=true;commit();return;
    case 'review':reviewWeek(wkCur);return;
    case 'adj-apply':{const r=wkCur.review;if(!r)return;r.adjustments.forEach((x,i)=>{if(ui.adjOn[i]===false)return;if(x.type==='calib')S.calib[x.kind]=Math.round(x.value*10)/10;else if(x.day>=0&&!S.setup.lightDays.includes(x.day))S.setup.lightDays.push(x.day);});r.applied=true;toast('다음 배분부터 반영돼요');commit();return;}
    case 'wipe':ui.confirmWipe=true;render();return;
    case 'wipe-no':ui.confirmWipe=false;render();return;
    case 'wipe-yes':(async()=>{await store.wipe();S=emptyState();ui.confirmWipe=false;ui.onb=0;ui.tab='today';ui.setupResult=null;render();setSaveState('새로 시작');})();return;
  }
}
function onFieldBase(f,el){
  const wkPlan=getWeek(planKey());const id=el.dataset.id;
  const v=el.type==='checkbox'?el.checked:el.value;
  switch(f){
    case 'p-name':S.profile.name=String(v).slice(0,20);store.save();return;
    case 'p-wake':case 'p-sleep':if(parseHm(v)!=null){S.profile[f==='p-wake'?'wake':'sleep']=v;applyRhythm();store.save();}return;
    case 'p-showxp':S.profile.showXP=!!v;commit();return;
    case 'rec-detail':case 'rec-bundle':{const r=wkPlan.recurring.find(x=>x.id===id);if(r)r[f==='rec-detail'?'detail':'bundle']=String(v).slice(0,60);store.save();return;}
    case 'rec-min':{const r=wkPlan.recurring.find(x=>x.id===id);if(r)r.minutes=clamp(Math.round(Number(v)||r.minutes),10,240);store.save();return;}
    case 'floor':wkPlan.floor=String(v).slice(0,60);store.save();return;
    case 'card-min':{const c=wkPlan.cards.find(x=>x.id===id);if(c)c.minutes=clamp(Math.round(Number(v)||c.minutes),10,900);store.save();return;}
    case 'card-dl':{const c=wkPlan.cards.find(x=>x.id===id);if(c){c.deadline=v||null;c.must=c.must||!!v;}commit();return;}
    case 'answer':wkPlan.answer=String(v).slice(0,140);store.save();return;
    case 'm-goal':{S.month.goal=String(v).slice(0,80);S.month.goalSet=!!S.month.goal;const mm=/(\d+(?:\.\d+)?)\s*(kg|킬로|점|개|권|명|회|만원|km|시간)/i.exec(S.month.goal);if(mm){const t=Math.max(1,Math.round(Number(mm[1]))),u=mm[2]==='킬로'?'kg':mm[2];if(t!==S.month.target||u!==S.month.unit){S.month.target=t;S.month.unit=u;store.save();render();return;}}store.save();return;}
    case 'm-unit':S.month.unit=String(v).slice(0,6);store.save();return;
    case 'm-cur':S.month.current=clamp(Math.round(Number(v)||0),0,99999);getWeek(curKey()).resultLogged=true;store.save();return;
    case 'm-if':S.month.ifthen=String(v).slice(0,90);store.save();return;
    case 'nf-start':ui.newFixed.start=v;return;
    case 'nf-end':ui.newFixed.end=v;return;
    case 'nf-label':ui.newFixed.label=v;return;
    case 'nf-clear':ui.newFixed.clearAfter=!!v;return;
    case 'adj':ui.adjOn[Number(el.dataset.i)]=!!v;return;
    case 'g-title':ui.gapNew.title=String(v).slice(0,60);return;
    case 'fxg-label':{const t=String(v).trim().slice(0,12);if(t){S.setup.fixed.forEach(f=>{if(f.gid===el.dataset.g)f.label=t;});store.save();}return;}
    case 'blk-title':{const wk=S.weeks[el.dataset.k];const b=wk&&wk.blocks.find(x=>x.id===id);if(b&&String(v).trim()){b.title=String(v).trim().slice(0,60);store.save();}return;}
  }
}

});

function blobsFromPaste(e){
  const out=[],cd=e.clipboardData;if(!cd)return out;
  for(const f of Array.from(cd.files||[]))if(/^image\//.test(f.type))out.push(f);
  if(!out.length)for(const it of Array.from(cd.items||[]))if(it.kind==='file'&&/^image\//.test(it.type)){const f=it.getAsFile();if(f)out.push(f);}
  return out;
}
function imgElToBlob(img){return new Promise(res=>{const go=()=>{try{const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;c.getContext('2d').drawImage(img,0,0);c.toBlob(b=>res(b),'image/png');}catch(e){res(null);}};if(img.complete&&img.naturalWidth)go();else{img.onload=go;img.onerror=()=>res(null);}});}
function pasteTarget(){return ui.tab==='guide'&&S.profile.done?'guide':(document.querySelector('[data-paste]')?'fixed':null);}
document.addEventListener('paste',e=>{
  const t=pasteTarget();if(!t)return;
  const fs=blobsFromPaste(e);if(!fs.length)return;
  e.preventDefault();if(t==='guide')guideImport(fs);else importFiles(fs);
});

  else if(z.textContent.length>80)z.textContent='';
});
document.addEventListener('change',e=>{const el=e.target;if(el.type==='file'&&el.dataset){const fs=Array.from(el.files||[]);el.value='';if(el.dataset.field==='g-import')guideImport(fs);else importFiles(fs);return;}if(el.dataset&&el.dataset.field&&(el.type==='checkbox'||el.tagName==='SELECT'))onField(el.dataset.field,el);});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&ui.sheet){ui.sheet=null;renderOverlay();return;}
  if(e.key!=='Enter'||e.isComposing)return;
  const el=e.target;if(!el.dataset||!el.dataset.field)return;
  const map={'todo-new':'todo-add','rec-new':'rec-add','keep-new':'keep-add','ask':'ask','q-todo':'quick-todo','q-cool':'quick-cool','g-title':'gap-add','blk-title':'sheet-close','fx-text':'fx-text','fx-label':'fx-label-set','fxg-label':'sheet-close','g-text':'g-send'};
  const a=map[el.dataset.field];if(a){e.preventDefault();act(a,{});}
});
