<title>다음 주</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: phone app shell. Sticky top bar, one column; Today = "now" hero card + a scrollable day timeline of time blocks (filled when done); Week = 7-column block grid + selected day's timeline; fixed tab bar, floating quick-add, bottom sheets for blocks and empty slots */
:root{
  --bg:#F2F1ED; --surface:#FFFFFF; --sunk:#E8E6E1; --line:#DCD9D2; --fg:#141414; --muted:#6A6761;
  --accent:#2D44F5; --on-accent:#FFFFFF; --accent-soft:#E4E7FE; --accent-text:#2233C2;
  --warn-soft:#FCEDE6; --warn-text:#8A2E0F; --scrim:rgba(12,12,16,.45);
  --now:#EE4B19; --hero:#141414; --on-hero:#F4F3EF;
  --k-deep:#2D44F5; --k-deep-on:#FFFFFF; --k-light:#E3A11C; --k-light-on:#1E1606;
  --k-out:#0E9C72; --k-out-on:#FFFFFF; --k-rest:#8E8980; --k-rest-on:#FFFFFF;
  --font:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C0C0E; --surface:#161619; --sunk:#202024; --line:#2D2D32; --fg:#F1F0EC; --muted:#9E9B94;
  --accent:#7383FF; --on-accent:#0A0B14; --accent-soft:#1D2142; --accent-text:#B4BCFF;
  --warn-soft:#2F1D15; --warn-text:#F7BFA6; --scrim:rgba(0,0,0,.62);
  --now:#FF6A3D; --hero:#1D1F33; --on-hero:#F1F0EC;
  --k-deep:#7383FF; --k-deep-on:#0A0B14; --k-light:#F2B544; --k-light-on:#1E1606;
  --k-out:#2CC496; --k-out-on:#04140E; --k-rest:#7C7871; --k-rest-on:#0C0C0E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C0C0E; --surface:#161619; --sunk:#202024; --line:#2D2D32; --fg:#F1F0EC; --muted:#9E9B94;
  --accent:#7383FF; --on-accent:#0A0B14; --accent-soft:#1D2142; --accent-text:#B4BCFF;
  --warn-soft:#2F1D15; --warn-text:#F7BFA6; --scrim:rgba(0,0,0,.62);
  --now:#FF6A3D; --hero:#1D1F33; --on-hero:#F1F0EC;
  --k-deep:#7383FF; --k-deep-on:#0A0B14; --k-light:#F2B544; --k-light-on:#1E1606;
  --k-out:#2CC496; --k-out-on:#04140E; --k-rest:#7C7871; --k-rest-on:#0C0C0E; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;word-break:keep-all;overflow-wrap:break-word;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overscroll-behavior-y:none}
#app{max-width:520px;margin:0 auto;padding-block:0 140px;display:flex;flex-direction:column;gap:16px}
body.onb #app{padding-block:0 120px}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:700;letter-spacing:-0.5px}
h1{font-size:26px;line-height:1.3}
h2{font-size:17px;letter-spacing:-0.3px}
p{margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.xs{font-size:12px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--bg);display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:52px;padding-top:6px}
.brand{font-weight:800;font-size:17px;letter-spacing:-0.5px;display:inline-flex;align-items:center;gap:8px}
.brand i{display:inline-grid;grid-template-columns:repeat(2,6px);gap:2px}
.brand i b{width:6px;height:6px;border-radius:2px;background:var(--fg)}
.brand i b:nth-child(2){background:var(--k-deep)}.brand i b:nth-child(3){background:var(--k-light)}.brand i b:nth-child(4){background:transparent;border:1.5px solid var(--fg)}
.top-right{display:flex;align-items:center;gap:8px}
.save-state{font-size:12px;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:10px}
.stack-lg{display:flex;flex-direction:column;gap:18px}
.row{display:flex;align-items:center;gap:10px}
.row-wrap{display:flex;flex-wrap:wrap;gap:8px}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.card{background:var(--surface);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.line{border:1px solid var(--line)}
.card.accent{background:var(--accent);color:var(--on-accent)}
.card.accent .muted{color:var(--on-accent);opacity:.78}
.card.soft{background:var(--accent-soft);color:var(--accent-text)}
.card.warn{background:var(--warn-soft);color:var(--warn-text)}
.card.dashed{background:transparent;border:1.5px dashed var(--line)}
.list{background:var(--surface);border-radius:var(--r);padding:2px 16px;display:flex;flex-direction:column}
.list>.item{padding:12px 0;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start;min-width:0}
.list>.item:last-child{border-bottom:0}
.item .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.label{font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.2px}
.section-title{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
.btn{white-space:nowrap;min-height:46px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:0 16px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn.ink{background:var(--fg);color:var(--bg);border-color:transparent}
.btn.block{width:100%;min-height:54px;font-size:16px}
.btn.ghost{background:transparent}
.btn.sm{min-height:40px;padding:0 10px;font-size:13.5px;border-radius:11px}
.btn.danger{color:var(--warn-text);border-color:color-mix(in srgb,var(--warn-text) 45%,transparent);background:transparent}
.btn[disabled]{opacity:.5;cursor:default}
.link{background:none;border:0;padding:0;color:var(--accent-text);font-size:13.5px;cursor:pointer;min-height:36px;text-align:left;font-weight:500}
.icon-btn{width:44px;height:44px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:20px;line-height:1;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.icon-btn.fill{background:var(--fg);color:var(--bg);border-color:transparent}
.icon-btn.plain{border:0;background:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.field{width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 12px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;cursor:pointer}
.sheet .chip{min-height:36px;padding:0 12px;font-size:13.5px}
.chip.on{background:var(--fg);color:var(--bg);border-color:transparent;font-weight:600}
.chip.soft-on{background:var(--accent-soft);color:var(--accent-text);border-color:transparent;font-weight:600}
.tag{display:inline-flex;align-items:center;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.tag.acc{background:var(--accent);color:var(--on-accent)}
.tag.soft{background:var(--accent-soft);color:var(--accent-text)}
.tag.warn{background:var(--warn-soft);color:var(--warn-text)}
.bar{height:8px;border-radius:999px;background:var(--sunk);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:999px}
.card.accent .bar{background:rgba(255,255,255,.22)}
.card.accent .bar>i{background:var(--on-accent)}
.stepper{display:flex;align-items:center;gap:4px}
.stepper .n{min-width:34px;text-align:center;font-family:var(--mono);font-size:18px;font-weight:500}
.time{font-family:var(--mono);font-size:12px;color:var(--muted);width:44px;flex-shrink:0;padding-top:2px;font-variant-numeric:tabular-nums}
.block-title{font-weight:600;font-size:15px;overflow-wrap:anywhere}
.why{font-size:12.5px;color:var(--muted)}
.ifthen{font-size:13px;color:var(--accent-text)}
.fixed .block-title{font-weight:500;color:var(--muted)}
.done .block-title{text-decoration:line-through;color:var(--muted)}
input[type=checkbox]{width:24px;height:24px;accent-color:var(--accent);margin:1px 0 0;flex-shrink:0}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.steps button{border:0;background:var(--sunk);border-radius:11px;min-height:44px;font-size:12.5px;cursor:pointer;color:var(--muted);padding:4px}
.steps button.on{background:var(--fg);color:var(--bg);font-weight:600}
.steps button.past{background:var(--accent-soft);color:var(--accent-text)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--mono);font-size:19px;font-weight:500}
.dots{display:flex;gap:6px}
.dots i{width:16px;height:16px;border-radius:5px;background:var(--sunk);display:block}
.dots i.on{background:var(--accent)}
.dots i.frz{background:transparent;border:2px solid var(--accent)}
.answer{white-space:pre-wrap;font-size:15px}

/* kinds */
.k-deep{--kc:var(--k-deep);--kon:var(--k-deep-on)}
.k-light{--kc:var(--k-light);--kon:var(--k-light-on)}
.k-out{--kc:var(--k-out);--kon:var(--k-out-on)}
.k-rest{--kc:var(--k-rest);--kon:var(--k-rest-on)}
.dot{width:12px;height:12px;border-radius:4px;background:var(--kc);flex-shrink:0;display:inline-block}

/* now hero */
.now-card{background:var(--hero);color:var(--on-hero);border-radius:24px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:10px}
.now-tag{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;letter-spacing:.2px;opacity:.9}
.now-tag i{width:8px;height:8px;border-radius:9px;background:var(--now)}
.now-tag i.calm{background:transparent;border:1.5px solid currentColor}
.now-title{font-size:25px;line-height:1.25;letter-spacing:-.6px;overflow-wrap:anywhere}
.now-left{display:flex;align-items:baseline;gap:8px}
.now-left .big{font-size:56px;line-height:1;font-weight:500;letter-spacing:-2px}
.now-bar{height:6px;border-radius:9px;background:rgba(255,255,255,.14);overflow:hidden}
.now-bar i{display:block;height:100%;background:var(--now);border-radius:9px}
.now-if{font-size:13px;opacity:.72}
.now-next{display:flex;flex-direction:column;gap:2px;padding-top:10px;border-top:1px solid rgba(255,255,255,.14);font-size:14px}
.now-next .xs{opacity:.6}
.now-act{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-top:2px}
.now-act.two{grid-template-columns:1fr 1fr}
.now-act.one{grid-template-columns:1fr}
.now-card .btn{background:rgba(255,255,255,.1);border-color:transparent;color:inherit}
.now-card .btn.primary{background:var(--on-hero);color:var(--hero)}

/* day ribbon */
.rib-wrap{display:flex;flex-direction:column;gap:8px}
.rib{display:flex;gap:3px;height:14px}
.rib i{flex-basis:0;min-width:5px;border-radius:4px;border:1.5px solid var(--kc);background:transparent}
.rib i.st-done{background:var(--kc)}
.rib i.st-now{background:repeating-linear-gradient(90deg,var(--kc) 0 3px,transparent 3px 6px);border-color:var(--now)}
.rib i.st-miss{opacity:.4;border-style:dashed}

/* timeline */
.tl-scroll{max-height:min(66vh,640px);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;border-radius:22px;background:var(--surface)}
.tl{position:relative;margin:16px 12px 16px 0}
.hr{position:absolute;left:44px;right:0;height:0;border-top:1px solid var(--line)}
.hr span{position:absolute;left:-40px;top:-8px;width:30px;text-align:right;font:500 11px/1 var(--mono);color:var(--muted)}
.tl-past{position:absolute;left:44px;right:0;top:0;background:repeating-linear-gradient(-45deg,transparent 0 7px,color-mix(in srgb,var(--sunk) 70%,transparent) 7px 8px);pointer-events:none}
.fx{position:absolute;left:50px;right:0;z-index:1;border-radius:12px;border:1px solid var(--line);background:repeating-linear-gradient(-45deg,var(--sunk) 0 5px,transparent 5px 10px);color:var(--muted);font-size:12.5px;padding:5px 10px;overflow:hidden;display:flex;gap:8px;align-items:flex-start;justify-content:space-between;font-weight:600}
.fx .mono{font-weight:400;font-size:11.5px}
.fx.t-move{border-style:dashed;background:transparent;font-size:11px;padding:0 10px;align-items:center;font-weight:500}
.fx.t-clear{background:transparent;border:1px dashed var(--line);font-weight:500}
.gap{position:absolute;left:50px;right:0;z-index:1;border:1.5px dashed var(--line);border-radius:12px;background:transparent;color:var(--muted);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;padding:0;font-weight:500}
.gap span{font-size:17px;line-height:1}
.gap:hover,.gap:focus-visible{border-color:var(--accent);color:var(--accent-text);background:color-mix(in srgb,var(--accent) 5%,transparent)}
.blk{position:absolute;left:50px;right:0;z-index:2;border-radius:12px;border:2px solid var(--kc);background:color-mix(in srgb,var(--kc) 9%,var(--surface));color:var(--fg);text-align:left;padding:6px 10px;cursor:pointer;overflow:hidden;display:flex;flex-direction:column;gap:1px;font:inherit}
.blk-t{font-weight:700;font-size:14px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:64px;letter-spacing:-.2px}
.blk-m{font:500 11.5px/1.3 var(--mono);opacity:.72}
.blk.short{flex-direction:row;align-items:center;gap:10px;padding-block:0}
.blk.short .blk-t{font-size:13px;padding-right:0;flex:1}
.blk.short .blk-b{display:none}
.blk.st-done{background:var(--kc);color:var(--kon)}
.blk.st-done .blk-m{opacity:.85}
.blk.st-now{border-color:var(--now);box-shadow:0 0 0 3px color-mix(in srgb,var(--now) 28%,transparent)}
.blk.st-miss{border-style:dashed;opacity:.5}
.blk-ck{position:absolute;right:10px;top:5px;font-size:15px;font-weight:800}
.blk.short .blk-ck{position:static}
.blk-b{position:absolute;right:8px;top:6px;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--kc);color:var(--kon)}
.blk-p{position:absolute;left:0;bottom:0;height:4px;background:var(--now)}
.nowline{position:absolute;left:38px;right:0;height:2px;background:var(--now);z-index:3;pointer-events:none}
.nowline::before{content:'';position:absolute;left:-4px;top:-4px;width:10px;height:10px;border-radius:9px;background:var(--now)}
.nowline span{position:absolute;right:0;top:-20px;font:600 11px/1 var(--mono);color:var(--on-accent);background:var(--now);padding:3px 6px;border-radius:6px}

/* week grid */
.wg{background:var(--surface);border-radius:22px;padding:10px 8px 12px}
.wg-head,.wg-body{display:grid;grid-template-columns:20px repeat(7,minmax(0,1fr));gap:4px}
.wg-head{margin-bottom:8px}
.wg-head button{border:0;background:transparent;border-radius:12px;min-height:58px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;font-size:12px;color:var(--muted);padding:2px 0}
.wg-head button b{font:600 15px/1.3 var(--mono);color:var(--fg)}
.wg-head button .xs{font-size:10.5px}
.wg-head button.td b{color:var(--now)}
.wg-head button.on{background:var(--fg);color:var(--bg)}
.wg-head button.on b{color:var(--bg)}
.wg-axis{position:relative}
.wg-axis span{position:absolute;right:2px;transform:translateY(-50%);font:500 10px/1 var(--mono);color:var(--muted)}
.wg-col{position:relative;border-radius:8px;background:var(--bg);cursor:pointer}
.wg-col.sel{box-shadow:0 0 0 2px var(--fg)}
.wg-col .m{position:absolute;left:2px;right:2px;border-radius:4px;border:1.5px solid var(--kc);display:block}
.wg-col .m.st-done{background:var(--kc)}
.wg-col .m.st-miss{opacity:.45;border-style:dashed}
.wg-col .m.f{border:0;background:repeating-linear-gradient(-45deg,var(--line) 0 3px,transparent 3px 6px)}
.wg-col .nl{position:absolute;left:-2px;right:-2px;height:2px;background:var(--now);display:block}

.pg-wrap{background:var(--surface);border-radius:18px;padding:10px 8px 12px}
.pg-head,.pg{display:grid;grid-template-columns:22px repeat(7,minmax(0,1fr));gap:3px}
.pg-head b{text-align:center;font-size:12px;color:var(--muted);font-weight:600;padding-bottom:4px}
.pg-col{display:flex;flex-direction:column;gap:1px;min-width:0}
.pg-axis{gap:0}
.pg-axis span{height:30px;font:500 10px/1 var(--mono);color:var(--muted);text-align:right;padding-right:2px}
.pg-day{touch-action:none;user-select:none;-webkit-user-select:none}
.pg-day i{position:relative;display:block;height:13px;border-radius:3px;background:var(--sunk);cursor:pointer;overflow:hidden}
.pg-day i:nth-child(even){margin-bottom:2px}
.pg-day i.on{background:var(--c)}

.g-att{position:relative}
.paste-zone{min-height:48px;border:1.5px dashed var(--line);border-radius:14px;padding:12px 14px;font-size:13px;color:var(--muted);background:transparent;outline:none;overflow:hidden;max-height:120px}
.paste-zone:focus{border-color:var(--accent);color:var(--fg)}
.paste-zone img{max-height:60px}
.imp-ics{position:relative;align-self:flex-start;font-size:13px;color:var(--accent-text);font-weight:500;min-height:36px;display:inline-flex;align-items:center;cursor:pointer}
.imp-ics input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;font-size:0}
/* sheets */
.tabs{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--surface) 88%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);z-index:6;
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
body.onb .tabs,body.onb .fab{display:none}
.tabs .inner{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.tabs button{border:0;background:transparent;min-height:54px;border-radius:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--muted)}
.tabs button svg{width:22px;height:22px}
.tabs button.on{color:var(--fg);font-weight:700}
.fab{position:fixed;right:calc(max(16px,env(safe-area-inset-right,0px)) + 4px);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:7;width:58px;height:58px;border-radius:20px;border:0;background:var(--fg);color:var(--bg);font-size:28px;cursor:pointer;box-shadow:0 8px 22px rgba(0,0,0,.22)}
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:9}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-radius:24px 24px 0 0;
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-height:88%;overflow-y:auto}
.sheet .inner{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 2px}
.title-field{font-size:20px;font-weight:700;border-color:transparent;background:var(--sunk);letter-spacing:-.3px}
.nudge{display:grid;grid-template-columns:34px repeat(4,minmax(0,1fr));gap:6px;align-items:center}
.cand{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:11px 12px;cursor:pointer;min-height:56px}
.cand>i{width:10px;align-self:stretch;border-radius:4px;background:var(--kc);flex-shrink:0}
.cand .grow{display:flex;flex-direction:column;gap:1px}
.cand.rec{border:2px solid var(--accent)}
.big-time{font:500 24px/1.2 var(--mono);letter-spacing:-.5px}
.onb-bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.onb-bar .inner{max-width:520px;margin:0 auto;display:grid;grid-template-columns:1fr 2fr;gap:8px}
.progress{display:grid;gap:4px}
.why-box{font-size:12.5px;color:var(--muted);background:var(--sunk);border-radius:12px;padding:10px 12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:11;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);font-weight:500}
.thinking{font-size:13.5px;color:var(--muted)}
.sep{height:1px;background:var(--line)}
.hero{padding-block:24px 8px;display:flex;flex-direction:column;gap:14px}
.hero h1{font-size:32px;line-height:1.25;letter-spacing:-1px}
.hero-blocks{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:6px}
.hero-blocks i{height:22px;border-radius:5px;border:2px solid var(--kc);display:block}
.hero-blocks i.f{background:var(--kc)}
@media (prefers-reduced-motion: no-preference){
  .btn,.chip,.tabs button,.blk,.gap{transition:background .15s,filter .15s,border-color .15s}
  .sheet.anim{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
  .now-tag i:not(.calm){animation:pulse 1.6s ease-in-out infinite}@keyframes pulse{50%{opacity:.35}}
}

/* ---- current timetable preview (shown while adding/editing a time) ---- */
.fxprev2{background:var(--surface);border-radius:var(--r);padding:12px 12px 10px;display:flex;flex-direction:column;gap:8px;border:1px solid var(--line)}
.wm{--ax:24px}
.wm-h,.wm-body{display:grid;grid-template-columns:var(--ax) repeat(7,minmax(0,1fr));gap:3px}
.wm-h{text-align:center;font-size:11.5px;font-weight:600;color:var(--muted);margin-bottom:4px}
.wm-h b{font-weight:600;border-bottom:2px solid transparent}
.wm-h b.f{color:var(--fg);border-bottom-color:var(--accent)}
.wm-ax{position:relative}
.wm-ax span{position:absolute;right:3px;transform:translateY(-50%);font:500 9.5px var(--mono);color:var(--muted)}
.wm-d{position:relative;background-color:var(--bg);border-radius:6px;background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% var(--hp)}
.wm-b{position:absolute;left:1px;right:1px;border-radius:4px;background:var(--c);color:#fff;overflow:hidden;display:block;opacity:.62;border:1px solid color-mix(in srgb,#fff 25%,var(--c))}
.wm-b em{display:block;font-style:normal;font-size:9.5px;line-height:1.15;font-weight:700;padding:1px 2px;word-break:keep-all;overflow:hidden;white-space:nowrap;text-overflow:clip}
.wm-b.foc{opacity:1;z-index:2;outline:2px solid var(--accent);outline-offset:1px;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.wm-b.ghost{background:repeating-linear-gradient(135deg,var(--c) 0 5px,color-mix(in srgb,var(--c) 70%,#fff) 5px 10px);outline-style:dashed}
@media (prefers-reduced-motion:no-preference){.wm-b.foc{animation:wmBlink 1.3s ease-in-out infinite}}
@keyframes wmBlink{0%,100%{outline-color:var(--accent)}50%{outline-color:transparent}}
.wm-where{font-size:13px}.wm-where b{font-weight:700}
.wm-warn{background:var(--warn-soft);color:var(--warn-text);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:600}
.wm-tag{font-size:11.5px;font-weight:700;background:var(--accent-soft);color:var(--accent-text);border-radius:999px;padding:2px 9px}
.wm-sheet{display:flex;flex-direction:column;gap:6px;margin:2px 0 0}

/* ================= pixel (도트) theme ================= */
@font-face{font-family:'Galmuri11';src:url(fonts/Galmuri11.woff2) format('woff2');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Galmuri11';src:url(fonts/Galmuri11-Bold.woff2) format('woff2');font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:'GalmuriMono11';src:url(fonts/GalmuriMono11.woff2) format('woff2');font-weight:400 700;font-style:normal;font-display:swap}
:root[data-px="full"]{--font:'Galmuri11','IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;--mono:'GalmuriMono11','IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --bd:#141414;--grid:rgba(20,20,20,.045);--sh:rgba(20,20,20,.9)}
@media (prefers-color-scheme: dark){:root[data-px="full"]:not([data-theme="light"]){--bd:#D9D7D0;--grid:rgba(255,255,255,.04);--sh:rgba(0,0,0,.9)}}
:root[data-px="full"][data-theme="dark"]{--bd:#D9D7D0;--grid:rgba(255,255,255,.04);--sh:rgba(0,0,0,.9)}
html[data-px="full"] *,html[data-px="full"] *::before,html[data-px="full"] *::after{border-radius:0!important}
html[data-px="full"]{background:var(--bg)}
html[data-px="full"] body{font-size:14px;line-height:1.6;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:16px 16px;background-attachment:fixed}
html[data-px="full"] h1,html[data-px="full"] h2,html[data-px="full"] h3,html[data-px="full"] .now-title,html[data-px="full"] .now-left .big,html[data-px="full"] .block-title,html[data-px="full"] .blk-t,html[data-px="full"] .brand,html[data-px="full"] .pf-name b,html[data-px="full"] .pf-stats b,html[data-px="full"] .fxc-start b,html[data-px="full"] .fxc-name,html[data-px="full"] .cele h2{letter-spacing:0!important}
html[data-px="full"] h1{font-size:22px;line-height:1.4}
html[data-px="full"] h2{font-size:15px}
html[data-px="full"] .now-title{font-size:22px}
html[data-px="full"] .now-left .big{font-size:55px;letter-spacing:0}
html[data-px="full"] .small{font-size:12.5px}.xs{font-size:11px}.label{font-size:11px;letter-spacing:0;font-weight:700}
html[data-px="full"] input,html[data-px="full"] select,html[data-px="full"] textarea{font-size:16px}
html[data-px="full"] .mono,html[data-px="full"] .time,html[data-px="full"] .hr span,html[data-px="full"] .stat b,html[data-px="full"] .stepper .n{font-weight:400}
html[data-px="full"] .top{border-bottom:2px solid var(--bd);margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
html[data-px="full"] .brand{font-size:16px}

/* panels */
html[data-px="full"] .card,html[data-px="full"] .list,html[data-px="full"] .stat,html[data-px="full"] .wg,html[data-px="full"] .tl-scroll,html[data-px="full"] .fxc,html[data-px="full"] .fxprev2,html[data-px="full"] .g-goal,html[data-px="full"] .g-nudge,html[data-px="full"] .pf-badge,html[data-px="full"] .pf-pick,html[data-px="full"] .imp-btn,html[data-px="full"] .sheet .first-act,html[data-px="full"] .msg.me p,html[data-px="full"] .g-body>p{border:2px solid var(--bd);box-shadow:0 4px 0 var(--bd)}
html[data-px="full"] .card.line{border:2px solid var(--bd)}
html[data-px="full"] .card.soft,html[data-px="full"] .card.warn,html[data-px="full"] .card.accent{border:2px solid var(--bd)}
html[data-px="full"] .card.dashed,html[data-px="full"] .addbtn{border:2px dashed var(--bd);box-shadow:none;background:transparent}
html[data-px="full"] .list{padding:2px 14px}
html[data-px="full"] .list>.item{border-bottom:2px dotted var(--line)}
html[data-px="full"] .msg.me p{box-shadow:3px 3px 0 var(--bd)}
html[data-px="full"] .g-body>p{box-shadow:3px 3px 0 var(--bd)}
html[data-px="full"] .now-card{border:2px solid var(--bd);box-shadow:0 5px 0 var(--bd);background-image:repeating-conic-gradient(rgba(255,255,255,.05) 0 25%,transparent 0 50%);background-size:4px 4px}
html[data-px="full"] .now-bar{height:10px;border:2px solid var(--on-hero);background:transparent}
html[data-px="full"] .now-bar i{background:repeating-linear-gradient(90deg,var(--now) 0 6px,transparent 6px 8px)}
html[data-px="full"] .now-next{border-top:2px dotted rgba(255,255,255,.3)}

/* controls: hard edge + press-down */
html[data-px="full"] .btn,html[data-px="full"] .icon-btn,html[data-px="full"] .chip,html[data-px="full"] .steps button,html[data-px="full"] .dayrow button,html[data-px="full"] .fxc-start,html[data-px="full"] .pf-pick,html[data-px="full"] .hd-chip,html[data-px="full"] .streak-line,html[data-px="full"] .tag{border:2px solid var(--bd)}
html[data-px="full"] .btn,html[data-px="full"] .icon-btn,html[data-px="full"] .chip,html[data-px="full"] .dayrow button,html[data-px="full"] .fxc-start,html[data-px="full"] .hd-chip,html[data-px="full"] .streak-line{box-shadow:0 3px 0 var(--bd)}
html[data-px="full"] .btn:active,html[data-px="full"] .icon-btn:active,html[data-px="full"] .chip:active,html[data-px="full"] .dayrow button:active,html[data-px="full"] .fxc-start:active,html[data-px="full"] .hd-chip:active,html[data-px="full"] .addbtn:active,html[data-px="full"] .pf-pick:active,html[data-px="full"] .imp-btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--bd)}
html[data-px="full"] .btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--bd)}
html[data-px="full"] .btn.ink{border-color:var(--bd)}
html[data-px="full"] .btn.danger{border-color:var(--warn-text);box-shadow:0 3px 0 var(--warn-text)}
html[data-px="full"] .btn[disabled]{box-shadow:none;transform:none}
html[data-px="full"] .btn,html[data-px="full"] .chip,html[data-px="full"] .tabs button,html[data-px="full"] .addbtn{font-weight:700}
html[data-px="full"] .icon-btn.plain{border:0;box-shadow:none;background:transparent}
html[data-px="full"] .icon-btn.fill{border-color:var(--bd)}
html[data-px="full"] .chip.on,html[data-px="full"] .dayrow button.on,html[data-px="full"] .steps button.on{background:var(--accent);color:var(--on-accent);border-color:var(--bd)}
html[data-px="full"] .chip.soft-on{border-color:var(--bd)}
html[data-px="full"] .tag{padding:1px 7px;font-weight:700}
html[data-px="full"] .field{border:2px solid var(--bd);box-shadow:inset 3px 3px 0 color-mix(in srgb,var(--bd) 12%,transparent)}
html[data-px="full"] .field:focus{outline:3px solid var(--accent);outline-offset:0}
html[data-px="full"] .fxc-start{background:var(--sunk)}
html[data-px="full"] input[type=checkbox]{appearance:none;-webkit-appearance:none;width:24px;height:24px;border:2px solid var(--bd);background:var(--surface);display:inline-grid;place-content:center;cursor:pointer}
html[data-px="full"] input[type=checkbox]:checked{background:var(--accent)}
html[data-px="full"] input[type=checkbox]:checked::after{content:"";width:12px;height:6px;border-left:3px solid var(--on-accent);border-bottom:3px solid var(--on-accent);transform:translateY(-2px) rotate(-45deg)}

/* bars: segmented like a game gauge */
html[data-px="full"] .bar{height:14px;border:2px solid var(--bd);background:var(--surface)}
html[data-px="full"] .bar>i{background:repeating-linear-gradient(90deg,var(--accent) 0 6px,transparent 6px 8px)}
html[data-px="full"] .card.accent .bar{background:transparent;border-color:var(--on-accent)}
html[data-px="full"] .card.accent .bar>i{background:repeating-linear-gradient(90deg,var(--on-accent) 0 6px,transparent 6px 8px)}
html[data-px="full"] .pf-bar{height:18px;border:2px solid #1c1400;background:rgba(0,0,0,.45);box-shadow:none}
html[data-px="full"] .pf-bar i{background:repeating-linear-gradient(90deg,#ffd23f 0 8px,#e0a800 8px 10px);box-shadow:none}
html[data-px="full"] .dots i{border:2px solid var(--bd);background:var(--surface)}.dots i.on{background:var(--accent)}

/* timeline & week */
html[data-px="full"] .hr{border-top:2px dotted var(--line)}
html[data-px="full"] .fx{border:2px dashed var(--line)}
html[data-px="full"] .blk{border:2px solid var(--bd);box-shadow:0 3px 0 color-mix(in srgb,var(--kc) 60%,#000);background:color-mix(in srgb,var(--kc) 14%,var(--surface))}
html[data-px="full"] .blk::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--kc)}
html[data-px="full"] .blk{padding-left:14px}
html[data-px="full"] .blk.st-done{background:var(--kc)}
html[data-px="full"] .blk.st-done::before{background:rgba(0,0,0,.25)}
html[data-px="full"] .blk.st-now{border-color:var(--now);box-shadow:0 0 0 3px var(--now)}
html[data-px="full"] .blk-b{border:2px solid var(--bd);font-weight:700}
html[data-px="full"] .gap{border:2px dashed var(--line)}
html[data-px="full"] .nowline{height:3px}
html[data-px="full"] .nowline::before{width:10px;height:10px}
html[data-px="full"] .wg-col{border:2px solid var(--line)}
html[data-px="full"] .wg-col.sel{box-shadow:none;border-color:var(--bd)}
html[data-px="full"] .wg-col .m{border:2px solid var(--kc)}
html[data-px="full"] .wg-head button{border:2px solid transparent}
html[data-px="full"] .wg-head button.on{background:var(--accent);color:var(--on-accent);border-color:var(--bd)}
html[data-px="full"] .wg-head button.on b{color:var(--on-accent)}
html[data-px="full"] .rib i{border:2px solid var(--kc)}
html[data-px="full"] .pf-day.td{border:2px solid var(--bd)}
html[data-px="full"] .wm-d{border:2px solid var(--line)}
html[data-px="full"] .wm-b{border:2px solid color-mix(in srgb,var(--c) 70%,#000)}
html[data-px="full"] .wm-b.foc{outline:3px solid var(--accent);outline-offset:0;box-shadow:none}

/* chrome: tab bar, sheet, toast, fab */
html[data-px="full"] .tabs{background:var(--surface);-webkit-backdrop-filter:none;backdrop-filter:none;border-top:3px solid var(--bd)}
html[data-px="full"] .tabs button{border:2px solid transparent;color:var(--muted);font-size:11px;gap:3px;font-weight:700}
html[data-px="full"] .tabs button svg{width:26px;height:26px}
html[data-px="full"] .tabs button.on{background:var(--accent);color:var(--on-accent);border-color:var(--bd);box-shadow:0 3px 0 var(--bd)}
html[data-px="full"] .fab{border:2px solid var(--bd);box-shadow:0 4px 0 var(--bd)}
html[data-px="full"] .fab:active{transform:translateY(4px);box-shadow:none}
html[data-px="full"] .sheet{border-top:3px solid var(--bd)}
html[data-px="full"] .grab{height:6px;background:var(--bd);width:48px}
html[data-px="full"] .toast{border:2px solid var(--bd);box-shadow:0 4px 0 var(--sh)}
html[data-px="full"] .toast.xp{border-color:#ffd23f}
html[data-px="full"] .cele{border:3px solid var(--bd);box-shadow:0 6px 0 var(--bd)}
html[data-px="full"] .wheel-band{border:2px solid var(--bd);background:var(--sunk)}
html[data-px="full"] .pf-card{border:3px solid #1c1400;box-shadow:0 5px 0 #1c1400}
html[data-px="full"] .pf-lv{border:2px solid #1c1400;box-shadow:0 3px 0 #b8860b}
html[data-px="full"] .pf-quiz{border:3px solid var(--bd)}
html[data-px="full"] .pf-badge.on{border:2px solid var(--bd)}
html[data-px="full"] .g-ava.px-ava{border:2px solid var(--bd)}

/* pixel-lite retired in the 2026.10 brand; pixel lives only in data-px="full" */

.lead-sw{display:flex;gap:8px;flex-wrap:wrap}
.lead-go{margin-top:2px}

.trk{display:flex;flex-direction:column;gap:8px}
.trk-lv{font-weight:800;font-size:15px;padding:2px 10px;border-radius:999px;background:var(--sunk)}
.trk-lv.lv-hi{background:#CFF0D6;color:#0B5A22}.trk-lv.lv-mid{background:#FFE9B5;color:#6B4600}.trk-lv.lv-lo{background:#FFD3CE;color:#8A1F14}
:root[data-theme="dark"] .trk-lv.lv-hi,:root:not([data-theme="light"]) .trk-lv.lv-hi{}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .trk-lv.lv-hi{background:#1C4A2B;color:#BDF0CB}:root:not([data-theme="light"]) .trk-lv.lv-mid{background:#524018;color:#FFE3A0}:root:not([data-theme="light"]) .trk-lv.lv-lo{background:#5A2420;color:#FFC9C3}}
:root[data-theme="dark"] .trk-lv.lv-hi{background:#1C4A2B;color:#BDF0CB}:root[data-theme="dark"] .trk-lv.lv-mid{background:#524018;color:#FFE3A0}:root[data-theme="dark"] .trk-lv.lv-lo{background:#5A2420;color:#FFC9C3}
.trk-bar,.trk-b{height:10px;border-radius:6px;background:var(--sunk);overflow:hidden;display:block}
.trk-b{height:8px;flex:1}
.trk-bar i,.trk-b i{display:block;height:100%;border-radius:6px;background:var(--muted)}
.trk i.lv-hi{background:#2E9E52}.trk i.lv-mid{background:#E3A11C}.trk i.lv-lo{background:#E0584B}
.trk-g{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.trk-g i{font-style:normal;text-align:center;font-size:12px;font-weight:700;padding:3px 0;border-radius:8px;background:var(--sunk);color:var(--muted)}
.trk-g i.on{color:#fff}.trk-g i.g-hi.on{background:#2E9E52}.trk-g i.g-mid.on{background:#C98A0E}.trk-g i.g-lo.on{background:#E0584B}
.trk-rows{display:flex;flex-direction:column;gap:6px}
.trk-row{display:flex;align-items:center;gap:8px}
.trk-nm{flex:0 0 38%;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 지난 블록은 회색, 끝낸 건 ✓ */
.blk.st-miss{--kc:var(--muted);background:var(--sunk);border-style:dashed;border-color:var(--line);color:var(--muted);opacity:1}
.blk.st-done{background:color-mix(in srgb,var(--muted) 22%,var(--surface));border:2px solid var(--muted);color:var(--fg)}
.blk.st-done .blk-t{text-decoration:line-through;text-decoration-thickness:1px}
.blk.st-done .blk-ck{color:#2E9E52;font-weight:900}
.wg-col .m.st-miss{background:var(--sunk);border:1.5px dashed var(--line);opacity:1}
.wg-col .m.st-done{background:var(--muted);border-color:var(--muted);opacity:.75}
.wg-col.pst{background:color-mix(in srgb,var(--sunk) 55%,transparent)}
.wg-head button.pst{opacity:.55}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:8px 12px;font:600 13px var(--font);cursor:pointer;min-height:38px}
.chip.on{background:var(--fg);color:var(--bg);border-color:transparent}
.g-sub{white-space:pre-line}
.ag-strip{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ag-list{display:flex;flex-direction:column;gap:6px}
.ag{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;border-radius:14px;background:var(--surface);color:var(--fg);padding:8px 12px;font:inherit;cursor:pointer;min-height:52px}
div.ag{cursor:default}
.ag-t{flex:0 0 42px;font-size:12px;line-height:1.3;color:var(--muted);text-align:left}
.ag-bar{flex:0 0 5px;align-self:stretch;border-radius:3px;background:var(--kc,var(--line))}
.ag-m{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.ag-m b{font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ag-m .xs{color:var(--muted)}
.ag-s{flex:0 0 auto;font-weight:800;font-size:13px}
.ag.ag-fx{background:transparent;border:1px dashed var(--line)}
.ag.ag-fx .ag-bar{background:repeating-linear-gradient(-45deg,var(--line) 0 3px,transparent 3px 6px)}
.ag.ag-gap{background:transparent;border:1.5px dashed var(--line);color:var(--muted)}
.ag.ag-gap .ag-s{font-size:18px}
.ag.blk-r.st-now{outline:2px solid var(--now,var(--accent));background:color-mix(in srgb,var(--kc) 10%,var(--surface))}
.ag.blk-r.st-now .ag-s{color:var(--now,var(--accent))}
.ag.blk-r.st-done{background:var(--sunk)}
.ag.blk-r.st-done .ag-bar{background:var(--muted)}
.ag.blk-r.st-done .ag-m b{text-decoration:line-through;text-decoration-thickness:1px;color:var(--muted)}
.ag.blk-r.st-done .ag-s{color:#2E9E52}
.ag.blk-r.st-miss{background:var(--sunk);color:var(--muted)}
.ag.blk-r.st-miss .ag-bar{background:var(--line)}
.ag.blk-r.st-miss .ag-m b{color:var(--muted)}
.wg-col .m{font-size:10px;line-height:1;text-align:center;overflow:hidden;color:var(--fg)}
.wg-col .m.st-done{color:var(--bg)}
.wg-col .m.f{background:color-mix(in srgb,var(--fg) 20%,var(--bg));border:1.5px solid color-mix(in srgb,var(--fg) 38%,var(--bg));color:var(--fg);display:flex;align-items:center;justify-content:center}
.wg-col .m.f span{font:700 10px/1.1 var(--font);letter-spacing:-.5px;overflow:hidden;white-space:nowrap}
.wg-col .m.k-deep,.wg-col .m.k-light,.wg-col .m.k-out,.wg-col .m.k-rest,.wg-col .m.k-event{display:flex;align-items:center;justify-content:center}
.wg-col .m.st-up,.wg-col .m.st-now{background:color-mix(in srgb,var(--kc) 28%,var(--bg));border-width:2px}
/* ===== 주간표 새 디자인: 과목별 색, 가벼운 칸 ===== */
.wg{--fa:hsl(var(--h,200) 75% 91%);--fb:hsl(var(--h,200) 55% 62%);--ft:hsl(var(--h,200) 55% 22%);padding:12px 8px 14px}
.wg .wg-col{background:color-mix(in srgb,var(--sunk) 45%,var(--surface));border-radius:10px}
.wg .wg-col.pst{background:transparent;opacity:.55}
.wg .wg-col.sel{box-shadow:none;background:color-mix(in srgb,var(--accent) 9%,var(--surface));outline:2px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:-1px}
.wg .wg-col .m.f{--a:hsl(var(--h) 80% 90%);--b:hsl(var(--h) 60% 55%);--t:hsl(var(--h) 60% 20%);background:var(--a);border:0;border-left:3px solid var(--b);border-radius:6px;color:var(--t);left:2px;right:2px}
.wg .wg-col .m.f span{font:700 11px/1.15 var(--font);letter-spacing:-.6px;color:var(--t)}
.wg .wg-col .m.st-up,.wg .wg-col .m.st-now{border-radius:6px}
.ag.ag-fx{background:hsl(var(--h,200) 80% 94%);border:0;color:hsl(var(--h,200) 60% 20%)}
.ag.ag-fx .ag-bar{background:hsl(var(--h,200) 60% 55%)}
.ag.ag-fx .ag-t,.ag.ag-fx .ag-m .xs{color:hsl(var(--h,200) 35% 38%)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .wg .wg-col .m.f{--a:hsl(var(--h) 32% 24%);--b:hsl(var(--h) 65% 62%);--t:hsl(var(--h) 85% 88%)}
:root:not([data-theme="light"]) .ag.ag-fx{background:hsl(var(--h,200) 28% 20%);color:hsl(var(--h,200) 80% 90%)}
:root:not([data-theme="light"]) .ag.ag-fx .ag-t,:root:not([data-theme="light"]) .ag.ag-fx .ag-m .xs{color:hsl(var(--h,200) 40% 72%)}}
:root[data-theme="dark"] .wg .wg-col .m.f{--a:hsl(var(--h) 32% 24%);--b:hsl(var(--h) 65% 62%);--t:hsl(var(--h) 85% 88%)}
:root[data-theme="dark"] .ag.ag-fx{background:hsl(var(--h,200) 28% 20%);color:hsl(var(--h,200) 80% 90%)}
:root[data-theme="dark"] .ag.ag-fx .ag-t,:root[data-theme="dark"] .ag.ag-fx .ag-m .xs{color:hsl(var(--h,200) 40% 72%)}

/* ================= 2026.10 redesign: one type family, one ink, one accent ================= */
:root{
  --bg:#F2F4F9; --surface:#FFFFFF; --sunk:#E8ECF4; --line:#DCE1EC; --fg:#161B2E; --muted:#636D86;
  --accent:#3B4BDB; --accent-edge:#2632A8; --on-accent:#FFFFFF; --accent-soft:#E7EAFD; --accent-text:#2B37B0;
  --warn-soft:#FDEDE9; --warn-text:#9A2D17; --scrim:rgba(14,18,34,.45);
  --now:#F0533A; --hero:#3340C9; --hero-edge:#222C93; --on-hero:#FFFFFF; --sun:#FFC53D;
  --k-deep:#3B4BDB; --k-deep-on:#FFFFFF; --k-light:#EE9A00; --k-light-on:#231600;
  --k-out:#12A27A; --k-out-on:#FFFFFF; --k-rest:#97A0B5; --k-rest-on:#FFFFFF;
  --ok:#1E9E5A;
  --font:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --mono:var(--font);
  --r:20px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E111A; --surface:#181C29; --sunk:#212636; --line:#2B3144; --fg:#EDF0F7; --muted:#959DB4;
  --accent:#7A88FF; --accent-edge:#4C58C8; --on-accent:#0A0D1F; --accent-soft:#222949; --accent-text:#BAC2FF;
  --warn-soft:#33201B; --warn-text:#FFB9A6; --scrim:rgba(0,0,0,.62);
  --now:#FF6B4F; --hero:#2C3590; --hero-edge:#1A2166; --on-hero:#F4F6FF; --sun:#FFC94F;
  --k-deep:#7A88FF; --k-deep-on:#0A0D1F; --k-light:#FFB648; --k-light-on:#231600;
  --k-out:#35C79A; --k-out-on:#04140E; --k-rest:#6F7891; --k-rest-on:#0E111A; --ok:#3CCB7F}}
:root[data-theme="dark"]{
  --bg:#0E111A; --surface:#181C29; --sunk:#212636; --line:#2B3144; --fg:#EDF0F7; --muted:#959DB4;
  --accent:#7A88FF; --accent-edge:#4C58C8; --on-accent:#0A0D1F; --accent-soft:#222949; --accent-text:#BAC2FF;
  --warn-soft:#33201B; --warn-text:#FFB9A6; --scrim:rgba(0,0,0,.62);
  --now:#FF6B4F; --hero:#2C3590; --hero-edge:#1A2166; --on-hero:#F4F6FF; --sun:#FFC94F;
  --k-deep:#7A88FF; --k-deep-on:#0A0D1F; --k-light:#FFB648; --k-light-on:#231600;
  --k-out:#35C79A; --k-out-on:#04140E; --k-rest:#6F7891; --k-rest-on:#0E111A; --ok:#3CCB7F}

body{font-size:15.5px;letter-spacing:-.15px;-webkit-font-smoothing:antialiased}
#app{gap:18px}
.mono{font-feature-settings:"tnum";letter-spacing:-.2px}
h1{font-size:25px;font-weight:800;letter-spacing:-.8px;line-height:1.32}
h2{font-size:18px;font-weight:750;letter-spacing:-.45px}
.label{font-size:13px;font-weight:650;letter-spacing:-.1px}
.small{font-size:14px}.xs{font-size:12.5px}

/* top bar */
.top{min-height:56px}
.brand{font-size:18px;font-weight:850;letter-spacing:-.7px}
.brand i b{border-radius:1px}
.brand i b:nth-child(1){background:var(--fg)}.brand i b:nth-child(2){background:var(--accent)}.brand i b:nth-child(3){background:var(--sun)}
.save-state{font-size:12px}
.hd-chip{border:0;background:var(--surface);min-height:36px;padding:5px 11px;box-shadow:inset 0 0 0 1.5px var(--line)}
.demo-bar{border-radius:16px;padding:8px 8px 8px 14px}
.demo-bar .btn{min-height:38px}

/* cards: flat on tinted ground; a border only when the card is an input target */
.card{border-radius:var(--r);padding:16px 18px;gap:10px}
.card.line{border:0}
.card.dashed{border:1.5px dashed var(--line)}
.card.soft{border-radius:var(--r)}
.list{border-radius:var(--r)}
.stat{border-radius:16px}
.section-title{align-items:center}
.section-title h2{font-size:19px}

/* buttons: a solid lower edge that presses down — the app's one game gesture */
.btn{border-radius:14px;border:0;font-weight:700;letter-spacing:-.2px;background:var(--surface);color:var(--fg);
  box-shadow:inset 0 0 0 1.5px var(--line),0 3px 0 var(--line);transition:transform .06s,box-shadow .06s}
.btn.primary{background:var(--accent);color:var(--on-accent);box-shadow:0 4px 0 var(--accent-edge)}
.btn.ink{background:var(--fg);color:var(--bg);box-shadow:0 3px 0 color-mix(in srgb,var(--fg) 60%,var(--bg))}
.btn.ghost{background:transparent;box-shadow:none}
.btn.danger{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--warn-text) 40%,transparent)}
.btn.sm{border-radius:12px;min-height:38px;padding:0 12px;box-shadow:inset 0 0 0 1.5px var(--line),0 2px 0 var(--line)}
.btn.sm.primary{box-shadow:0 3px 0 var(--accent-edge)}
.btn:active:not([disabled]){transform:translateY(3px);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.primary:active:not([disabled]){box-shadow:none}
.btn[disabled]{box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.primary[disabled]{box-shadow:none}
.icon-btn{border:0;box-shadow:inset 0 0 0 1.5px var(--line)}
.icon-btn.fill{background:var(--accent);color:var(--on-accent);box-shadow:0 3px 0 var(--accent-edge)}
.icon-btn.plain{box-shadow:none}
.link{font-weight:600}
.field{border:1.5px solid var(--line);border-radius:14px}
.field:focus{border-color:var(--accent);outline:0}
.chip,.sheet .chip{border-radius:999px;border:1.5px solid var(--line);font-weight:600}
.chip.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.chip.soft-on{border-color:transparent}
.tag{font-weight:650}
.steps button.on,.dl-row button.on{background:var(--accent);color:var(--on-accent)}
.tile.on{background:var(--accent);color:var(--on-accent)}
input[type=checkbox]{accent-color:var(--accent)}
.bar>i{background:var(--accent)}

/* tab bar + floating add */
.tabs{background:color-mix(in srgb,var(--surface) 92%,transparent);border-top:0;box-shadow:0 -1px 0 var(--line)}
.tabs button{font-size:11.5px;font-weight:600;border-radius:14px;color:var(--muted)}
.tabs button.on{background:var(--accent-soft);color:var(--accent-text);font-weight:750}
.fab{background:var(--accent);color:var(--on-accent);border-radius:20px;box-shadow:0 4px 0 var(--accent-edge)}
.fab:active{transform:translateY(3px);box-shadow:none}

/* the "now" hero: the one loud thing on screen */
.now-card{background:var(--hero);color:var(--on-hero);border-radius:26px;padding:18px 18px 16px;box-shadow:0 5px 0 var(--hero-edge)}
.now-title{font-size:24px;font-weight:800;letter-spacing:-.7px}
.now-tag{font-weight:650}
.now-tag i{background:var(--sun)}
.now-bar{background:rgba(255,255,255,.16);height:8px}
.now-bar i{background:var(--sun)}
.now-next{border-top-color:rgba(255,255,255,.18)}
.now-card .btn{background:rgba(255,255,255,.14);color:inherit;box-shadow:0 3px 0 rgba(0,0,0,.22)}
.now-card .btn.primary{background:#fff;color:var(--hero);box-shadow:0 4px 0 rgba(0,0,0,.28)}
.now-card .btn:active{box-shadow:none}

/* guide chat */
.msg.me p{background:var(--accent);color:var(--on-accent);border-radius:20px 20px 6px 20px}
.g-body>p{border-radius:6px 20px 20px 20px}
.g-ava.px-ava{background:var(--accent-soft)}
.g-nudge{border:0;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--accent) 40%,var(--line))}
.g-compose .field{border-radius:18px}
.g-compose .btn{border-radius:18px}
.chip.opt{background:var(--accent-soft);color:var(--accent-text);border-color:transparent}

/* sheets, toasts, timeline */
.sheet{border-radius:28px 28px 0 0}
.grab{background:var(--line)}
.toast{border-radius:14px;font-weight:600}
.tl-scroll{border-radius:var(--r)}
.blk{border-radius:12px}
.streak-line{background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);font-weight:600}
.streak-line.on{background:color-mix(in srgb,var(--sun) 22%,var(--surface));box-shadow:none}
.pf-lv{background:var(--sun)}
.pf-bar i{background:var(--sun)}
.pf-badge{border-radius:16px}
.pf-badge.on{background:color-mix(in srgb,var(--sun) 18%,var(--surface));border:0;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--sun) 55%,var(--line))}
.toast.xp{border-color:var(--sun)}.toast.xp b{color:var(--sun)}
.onb-guide .bubble{border:0;box-shadow:inset 0 0 0 1.5px var(--line)}
.onb-guide .bubble:before{border:0}
.pp-blk{border-radius:18px}
.first-act{border-radius:var(--r)}
.alt-opt{border:0;box-shadow:inset 0 0 0 1.5px var(--line);border-radius:16px}
.ag{border-radius:16px}
.dayrow button{border:1.5px solid var(--line)}
.dayrow button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.fxc{border:0;box-shadow:inset 0 0 0 1.5px var(--line);border-radius:var(--r)}
/* onboarding: a day drawn as a ribbon of blocks */
.hero-blocks{display:flex;gap:4px;height:16px}
.hero-blocks i{flex:1;height:16px;border-radius:5px;border:2px solid var(--kc);background:transparent}

.hero .mono.small{display:inline-block;align-self:flex-start;background:var(--accent-soft);color:var(--accent-text);font-weight:700;font-size:12px;padding:3px 9px;border-radius:999px}

/* ================= daily routine ================= */
.rt-plant{display:block;flex-shrink:0;image-rendering:pixelated}

.rt-count{font-size:14px;color:var(--muted);font-feature-settings:"tnum"}

.rt-row{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:18px;padding:10px 10px 10px 12px;min-height:64px}
.rt-row .rt-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.rt-row .rt-txt b{font-size:16px;font-weight:700;letter-spacing:-.3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt-row.on{background:color-mix(in srgb,var(--ok) 10%,var(--surface))}
.rt-row.on .rt-txt b{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1.5px}
.rt-row.no{opacity:.6}
.rt-hint{display:block;font-size:12.5px;line-height:1.45;color:var(--warn-text);margin-top:2px}
p.rt-hint{margin:0;background:var(--warn-soft);padding:10px 12px;border-radius:14px}
.rt-ck{width:44px;height:44px;flex-shrink:0;border-radius:14px;border:0;background:var(--surface);box-shadow:inset 0 0 0 2px var(--line),0 3px 0 var(--line);cursor:pointer;font:800 20px/1 var(--font);color:#fff}

.rt-ck:active{transform:translateY(3px);box-shadow:inset 0 0 0 2px var(--line)}
.rt-mini{flex-shrink:0;min-height:36px;padding:0 10px;border-radius:12px;border:0;background:transparent;color:var(--muted);font:650 13px var(--font);cursor:pointer}
.rt-mini:hover{color:var(--accent-text)}
.rt-eve{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:16px;background:var(--accent-soft);color:var(--accent-text)}
.rt-empty{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:var(--r);padding:14px 14px 14px 12px}
.rt-empty .grow{display:flex;flex-direction:column;gap:2px}
.rt-empty-art{width:52px;height:52px;border-radius:14px;background:color-mix(in srgb,var(--ok) 12%,var(--surface));display:grid;place-items:center;flex-shrink:0}
.rt-fresh{display:flex;flex-direction:column;gap:10px;padding:16px 18px;border-radius:var(--r);background:color-mix(in srgb,var(--sun) 24%,var(--surface));color:var(--fg)}
.rt-fresh .grow{display:flex;flex-direction:column;gap:4px}
.rt-fresh b{font-size:17px;letter-spacing:-.4px}
.rt-lead{margin-top:-8px}
.rt-card{background:var(--surface);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:14px}
.rt-card-top{display:flex;align-items:center;gap:14px}
.rt-card-top .grow{display:flex;flex-direction:column;gap:2px}
.rt-name{font-size:19px;font-weight:800;letter-spacing:-.5px;line-height:1.3}
.rt-pot{width:88px;height:88px;border-radius:20px;display:grid;place-items:center;flex-shrink:0;
  background:linear-gradient(transparent 70%,color-mix(in srgb,var(--ok) 14%,var(--surface)) 70%),color-mix(in srgb,var(--sun) 12%,var(--surface))}
.rt-meter{display:flex;flex-direction:column;gap:6px}
.rt-pct{font-size:14px;color:var(--muted)}
.rt-pct b{font-size:20px;color:var(--fg)}
.rt-bar{height:12px;border-radius:7px;background:var(--sunk);overflow:hidden}
.rt-bar i{display:block;height:100%;border-radius:7px;background:var(--ok);background:repeating-linear-gradient(90deg,var(--ok) 0 10px,color-mix(in srgb,var(--ok) 80%,#000) 10px 12px)}
.rt-meta{padding-top:2px}
.rt-dots{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px}
.rt-dots i{aspect-ratio:1;border-radius:5px;display:block;background:var(--sunk)}
.rt-dots i.d-f{background:var(--ok)}
.rt-dots i.d-m{background:linear-gradient(135deg,var(--ok) 50%,color-mix(in srgb,var(--ok) 30%,var(--surface)) 50%)}
.rt-dots i.d-x{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.rt-dots i.d-r{background:repeating-linear-gradient(-45deg,var(--sunk) 0 3px,transparent 3px 6px)}
.rt-dots i.d-td{background:transparent;box-shadow:inset 0 0 0 2px var(--accent)}
.rt-dots i.d-off{opacity:.35}
.rt-form{gap:16px}
.rt-preview{margin:0;padding:12px 14px;border-radius:14px;background:var(--accent-soft);color:var(--accent-text);font-weight:700;letter-spacing:-.3px}
.rt-why ul{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:8px;line-height:1.6}
.rt-why summary{cursor:pointer;min-height:36px;display:flex;align-items:center}
.rt-garden-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.rt-g{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;padding:10px 6px;border-radius:16px;background:color-mix(in srgb,var(--sun) 10%,var(--sunk))}
.rt-g b{font-size:13px;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .rt-fresh{background:var(--surface);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--sun) 55%,transparent)}
:root:not([data-theme="light"]) .rt-fresh b{color:var(--sun)}
:root:not([data-theme="light"]) .rt-g{background:var(--sunk)}
:root:not([data-theme="light"]) .rt-pot{background:linear-gradient(transparent 70%,color-mix(in srgb,var(--ok) 14%,var(--sunk)) 70%),var(--sunk)}}
:root[data-theme="dark"] .rt-fresh{background:var(--surface);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--sun) 55%,transparent)}

/* ================= readability pass: bigger type, stronger secondary text, roomier targets ================= */

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--muted:#A9B1C7}}

/* ================= first run ================= */
.onb-w{padding-top:6px}

.ex-arrow{align-self:center;color:var(--muted);font-size:18px;line-height:1}
.ex-plan{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-radius:16px;background:var(--accent-soft);color:var(--accent-text)}

.paths{display:flex;flex-direction:column;gap:10px}

  background:var(--surface);color:var(--fg);box-shadow:inset 0 0 0 1.5px var(--line),0 3px 0 var(--line)}

/* ================= add sheet ================= */
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:16px;background:var(--sunk)}
.seg2 button{min-height:44px;border:0;border-radius:12px;background:transparent;font:700 15.5px var(--font);color:var(--muted);cursor:pointer}

/* ================= change summary ================= */

/* ================= week navigation, inbox ================= */
.wk-nav{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;gap:8px}

.ibx-row b{font-size:16px}

/* ================= import review ================= */
.imp-more summary{cursor:pointer;min-height:42px;display:flex;align-items:center;color:var(--accent-text);font-weight:600;font-size:14.5px}
.imp-row{display:flex;gap:10px;padding:12px;border-radius:16px;background:var(--sunk)}

/* =====================================================================

   violet  = the one action colour (Duolingo: one saturated CTA)
   sunrise = the guide, "now", streaks (Headspace: warm, rounded, simple faces)

   off-white canvas + white cards, one typeface (Things)
   ===================================================================== */
:root{

  --warn-soft:#FFEDE6; --warn-text:#A3361A; --scrim:rgba(26,16,48,.46);
  --now:#FF7A45; --hero:#5B3DF5; --hero-edge:#3E22C4; --on-hero:#FFFFFF;
  --k-deep:#6B4EFF; --k-deep-on:#FFFFFF; --k-light:#F5A300; --k-light-on:#2A1A00;

}

  --sun:#FFD166; --rise:#FF8A5B; --rise-soft:#3A2420; --ok:#3BCB94;
  --warn-soft:#3A221C; --warn-text:#FFB7A1; --scrim:rgba(0,0,0,.62);
  --now:#FF8A5B; --hero:#4A31D4; --hero-edge:#2E1C93; --on-hero:#FFFFFF;

  --k-out:#3BCB94; --k-out-on:#06150F; --k-rest:#7A7193; --k-rest-on:#110D1B; --k-event:#FF7AA0;
  --sh1:0 1px 0 rgba(255,255,255,.03),0 8px 24px rgba(0,0,0,.28); --sh2:0 12px 36px rgba(0,0,0,.45); color-scheme:dark}}

/* ---------- type ---------- */
body{background:var(--bg);color:var(--fg)}
h1{font-weight:850;letter-spacing:-1px}
h2{font-weight:800;letter-spacing:-.5px}
.label{font-weight:750}

/* ---------- surfaces: white cards float on the tinted canvas ---------- */
.card,.list,.stat,.rt-card,.rt-row,.rt-empty,.wg,.ag,.first-card,.ex,.g-body>p,.pp-blk,.first-act,.tl-scroll,.help,.opt{box-shadow:var(--sh1)}
.card{border-radius:var(--r)}
.card.dashed,.card.soft,.card.warn{box-shadow:none}
.card.soft{background:var(--accent-soft);color:var(--fg)}

(function(){
'use strict';

/* ---------- helpers ---------- */
const DAYS=['월','화','수','목','금','토','일'];
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fromIso=s=>{const p=String(s).split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const today=()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate());};
const mondayOf=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x;};
const dow=d=>(d.getDay()+6)%7;
const hm=m=>pad(Math.floor(m/60)%24)+':'+pad(m%60);
const parseHm=s=>{const m=/^(\d{1,2}):(\d{2})$/.exec(String(s||''));return m?Number(m[1])*60+Number(m[2]):null;};
const md=d=>(d.getMonth()+1)+'.'+d.getDate();
const monthKey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const clamp=(n,a,b)=>Math.min(b,Math.max(a,n));
const clone=o=>JSON.parse(JSON.stringify(o));
const nowMin=()=>{const n=new Date();return n.getHours()*60+n.getMinutes();};
const curKey=()=>iso(mondayOf(today()));
const planKey=()=>dow(today())===6?iso(addDays(mondayOf(today()),7)):curKey();
const weekDayIndex=(key,dateIso)=>Math.round((fromIso(dateIso)-fromIso(key))/864e5);

/* ---------- profile options ---------- */
const OPT={
  age:['10대','20대','30대','40대','50대 이상'],
  gender:['여성','남성','말하고 싶지 않음'],

/* ---------- allocation engine ---------- */
function windowFor(pref){
  const s=S.setup;
  const w={morning:[s.dayStart,720],afternoon:[780,1080],evening:[1080,Math.min(s.dayEnd,1290)],night:[1260,s.dayEnd]};
  if(pref==='focus')return w[s.focus]||w.afternoon;
  return w[pref]||[s.dayStart,s.dayEnd];
}
function busyFor(day,blocks,skipId){
  const s=S.setup,out=[];
  for(const f of s.fixed)if(f.dow===day){out.push([f.start,f.end]);if(f.clearAfter)out.push([f.end,s.dayEnd+60]);}
  for(const c of commuteFor(day))out.push(c);
  for(const b of blocks)if(b.day===day&&b.id!==skipId&&b.dur>0)out.push([b.start,b.start+b.dur]);
  return out;
}
function fits(day,start,dur,blocks,skipId){
  const s=S.setup;
  if(start<s.dayStart||start+dur>s.dayEnd)return false;
  for(const iv of busyFor(day,blocks,skipId))if(start<iv[1]+10&&start+dur+10>iv[0])return false;
  return true;
}
function findSlot(day,dur,pref,blocks,minStart,skipId){
  const tryWin=w=>{
    let t=Math.ceil(Math.max(w[0],minStart||0)/10)*10;
    for(;t+dur<=w[1];t+=10)if(fits(day,t,dur,blocks,skipId))return t;
    return -1;
  };
  let r=tryWin(windowFor(pref));
  if(r<0)r=tryWin([S.setup.dayStart,S.setup.dayEnd]);
  return r;
}
function dayCapacity(d,buffer){
  const s=S.setup;let free=s.dayEnd-s.dayStart;
  for(const f of s.fixed)if(f.dow===d)free-=f.clearAfter?Math.max(0,s.dayEnd-f.start):(f.end-f.start);
  if(d<5&&s.commute&&s.fixed.some(f=>f.dow===d))free-=s.commute*2;
  let cap=Math.max(0,free)*(1-buffer);
  if((s.lightDays||[]).includes(d))cap*=0.7;
  if(S.season)cap*=0.6;
  return cap;
}
function allocate(wk,buffer,opt){
  opt=opt||{};
  const isCur=wk.key===curKey();
  const t0=opt.fromDay!=null?opt.fromDay:(isCur?dow(today()):0);
  const blocks=wk.blocks.filter(b=>b.pinned||b.done).map(b=>Object.assign({},b));
  const cap=[],used=[],deep=[];
  for(let d=0;d<7;d++){
    cap[d]=d<t0?0:dayCapacity(d,buffer);
    used[d]=blocks.filter(b=>b.day===d).reduce((a,b)=>a+b.dur,0);
    deep[d]=blocks.filter(b=>b.day===d&&b.kind==='deep').length;
  }
  const overflow=[];
  const minFor=d=>(isCur&&!opt.ignoreNow&&d===dow(today()))?nowMin()+30:0;
  const range=(a,b)=>{const r=[];for(let i=a;i<=b;i++)r.push(i);return r;};
  function tryPlace(item,d,reason){
    if(d<t0||d>6)return false;
    if(item.dur>0&&used[d]+item.dur>cap[d])return false;
    if(item.kind==='deep'&&deep[d]>=3)return false;
    const st=item.dur>0?findSlot(d,item.dur,item.pref,blocks,minFor(d)):findSlot(d,60,'evening',blocks,minFor(d));
    if(st<0)return false;
    blocks.push({id:uid(),day:d,start:st,dur:item.dur,title:item.title,kind:item.kind,src:item.src,refId:item.refId,
      deadline:item.deadline||null,reason,ifthen:'',pinned:false,done:false,hold:item.dur===0});
    used[d]+=item.dur;if(item.kind==='deep')deep[d]++;
    return true;
  }
  function placeAny(item,days,reason){
    for(const d of days)if(tryPlace(item,d,reason))return true;
    overflow.push({title:item.title,dur:item.dur,src:item.src,refId:item.refId});
    return false;
  }
  const recCount=r=>S.season?Math.min(r.count,1):r.count;
  const spread=n=>{const a=[];for(let i=0;i<n;i++)a.push(Math.min(6,Math.floor(i*7/n)));return a;};
  function placeRec(r){
    const n=recCount(r);
    let need=n-blocks.filter(b=>b.refId===r.id).length;if(need<=0)return;
    const title=r.name+(r.detail?' · '+r.detail:'');
    const reason=r.guard?'지키는 선이라 가장 먼저 잡았어요':'주 '+n+'회를 고르게 나눴어요 · 같은 시간대 우선';
    const tried=new Set();
    for(const d of [...spread(n),...range(0,6)]){
      if(need<=0)break;
      if(tried.has(d))continue;tried.add(d);
      if(blocks.some(b=>b.day===d&&b.refId===r.id))continue;
      if(tryPlace({title,dur:r.minutes,kind:r.kind,pref:r.pref,src:'rec',refId:r.id},d,reason))need--;
    }
    for(let i=0;i<need;i++)overflow.push({title:r.name,dur:r.minutes,src:'rec',refId:r.id});
  }
  const recs=wk.recurring.filter(r=>r.count>0);
  recs.filter(r=>r.guard).forEach(placeRec);
  const cards=wk.cards.filter(c=>c.on!==false).map(c=>Object.assign({},c,{sug:false}))
    .concat(wk.suggestions.filter(s=>s.accepted).map(s=>Object.assign({},s,{sug:true,must:false,goal:s.type==='goal',deadline:null})));
  const prio=c=>c.must?0:c.goal?1:c.sug?2:3;
  cards.sort((a,b)=>prio(a)-prio(b)||String(a.deadline||'9').localeCompare(String(b.deadline||'9')));
  for(const c of cards){
    const minutes=Math.round((Number(c.minutes)||0)*(S.calib[c.kind]||1)/10)*10;
    let parts;
    if(minutes===0)parts=[{dur:0,label:''}];
    else if(c.kind==='deep'&&minutes>75){const n=Math.max(2,Math.round(minutes/50));parts=Array.from({length:n},(_,i)=>({dur:50,label:' '+(i+1)+'/'+n}));}
    else parts=[{dur:Math.max(20,minutes),label:''}];
    parts=parts.slice(blocks.filter(b=>b.refId===c.id).length);
    let last=6,reason;
    const dl=c.deadline?weekDayIndex(wk.key,c.deadline):null;
    if(dl!=null){
      last=clamp(dl-1,t0,6);if(dl-1<t0)last=clamp(dl,t0,6);
      reason=(dl>=0&&dl<=6?DAYS[dl]+'요일':'마감')+' 하루 전까지 끝나도록 앞에서부터 깔았어요';
    }else reason=c.goal?'이번 달 목표와 연결된 일이에요':c.sug?'추가한 제안이에요':'남는 시간에 넣었어요';
    if(c.kind==='deep')reason+=' · 집중이 잘 되는 시간대';
    if(minutes===0)reason='계획 없이 비워 두는 저녁이에요';
    const pref=c.kind==='deep'?'focus':c.kind==='out'?'afternoon':'any';
    const days=minutes===0?range(t0,Math.max(t0,5)).reverse():range(t0,last);
    for(const p of parts)placeAny({title:c.title+p.label,dur:p.dur,kind:c.kind,pref,src:c.sug?'sug':'card',refId:c.id,deadline:c.deadline},days,reason);
  }
  recs.filter(r=>!r.guard).forEach(placeRec);

  for(const b of blocks)if(!b.ifthen)b.ifthen=templateIfThen(b);
  let available=0,placed=0;
  for(let d=0;d<7;d++){available+=cap[d];placed+=used[d];}
  return {blocks,overflow,available:Math.round(available),placed:Math.round(placed)};
}
function templateIfThen(b){

  else if(/독서|읽기|책/.test(t))step='책을 펴고 한 쪽만 읽는다';
  else if(/전화|연락/.test(t))step='연락처를 열어 둔다';
  else if(/명상|산책/.test(t))step='휴대폰을 내려놓고 밖으로 나간다';
  else if(b.kind==='deep')step='파일을 열고 첫 문장만 쓴다';
  else if(b.kind==='out')step='나갈 준비물부터 챙긴다';

}

function weekXP(wk){
  const items=[];if(!wk)return {items,sum:0};
  if(wk.confirmed)items.push(['일요일 정리',50]);
  if(wk.confirmed&&wk.comeback)items.push(['다시 돌아온 주',40]);
  const done=wk.blocks.filter(b=>b.done);
  for(const r of wk.recurring.filter(r=>r.guard&&r.count>0)){
    const n=done.filter(b=>b.refId===r.id).length;
    if(n>=(S.season?1:r.count))items.push(['지키는 선 · '+r.name+' '+n+'/'+r.count,15]);
  }
  const fl=Object.keys(wk.floorDone||{}).length;
  if(fl)items.push(['최소 행동 '+fl+'일',Math.min(35,fl*5)]);
  const nb=done.filter(b=>b.src!=='sug'&&b.src!=='rest'&&b.kind!=='event'&&b.dur>0).length;
  if(nb)items.push(['해낸 블록 '+nb+'개 (주당 60까지)',Math.min(60,nb*5)]);
  const ns=done.filter(b=>b.src==='sug').length;
  if(ns)items.push(['길잡이 제안 실천 '+ns+'개',ns*10]);
  if(wk.accepted)items.push(['다시 배치 받아들임 '+wk.accepted+'번',Math.min(20,wk.accepted*5)]);
  if(wk.resultLogged)items.push(['이번 달 결과 기록',20]);
  return {items,sum:items.reduce((a,b)=>a+b[1],0)};
}
function totalXP(){return S.xpBank+Object.values(S.weeks).reduce((a,w)=>a+weekXP(w).sum,0);}
function levelInfo(){const t=totalXP();return {total:t,lv:Math.floor(t/300)+1,into:t%300};}
function streakInfo(){
  const set=new Set(S.streak.weeks);const prot=S.streak.protect||{};
  let k=set.has(curKey())?curKey():iso(addDays(fromIso(curKey()),-7));
  let n=0;const dots=[];const used={};
  for(let i=0;i<26;i++){
    const mk=k.slice(0,7);
    if(set.has(k)){n++;dots.push('on');}
    else if(prot[k])dots.push('frz');
    else if(n>0&&!used[mk]){used[mk]=true;dots.push('frz');}
    else break;
    k=iso(addDays(fromIso(k),-7));
  }
  const four=dots.slice(0,4);while(four.length<4)four.push('');
  return {n,dots:four.reverse(),freezeLeft:used[monthKey(today())]?0:1};
}
function feedbackLine(wk){
  const done=wk.blocks.filter(b=>b.done&&b.dur>0).length,total=wk.blocks.filter(b=>b.dur>0).length;
  const guards=wk.recurring.filter(r=>r.guard&&r.count>0);
  const met=guards.filter(r=>wk.blocks.filter(b=>b.done&&b.refId===r.id).length>=(S.season?1:r.count)).length;
  const fl=Object.keys(wk.floorDone||{}).length;
  const prevK=iso(addDays(fromIso(wk.key),-7)),prev=S.weeks[prevK];
  const prevDone=prev?prev.blocks.filter(b=>b.done&&b.dur>0).length:null;
  if(wk.comeback)return '한 주를 쉬고 다시 돌아왔어요. 가장 어려운 첫 발을 뗐어요.';
  if(guards.length&&met===guards.length&&done)return '지키는 선을 모두 지켰고, 블록 '+done+'/'+total+'개를 해냈어요.';
  if(done&&prevDone!=null&&done>prevDone)return '지난주의 나보다 블록 '+(done-prevDone)+'개를 더 해냈어요.';
  if(done)return '블록 '+done+'/'+total+'개를 해냈어요.'+(fl?' 최소 행동은 '+fl+'일 지켰어요.':'');
  if(fl)return '바쁜 주에도 최소 행동을 '+fl+'일 지켰어요.';
  return wk.confirmed?'한 주를 정리해 둔 것만으로 다음 주가 가벼워져요.':'아직 이번 주 기록이 없어요.';

  const kinds={};for(const k of ['deep','light','out']){const bs=wk.blocks.filter(b=>b.kind===k&&b.dur>0);kinds[k]={planned:bs.length,done:bs.filter(b=>b.done).length};}
  const stats={profile:profileCtx(),perDay:per,perKind:kinds,overflow:wk.overflow.length,movedAndAccepted:wk.accepted,floorDays:Object.keys(wk.floorDone).length,
    guards:wk.recurring.filter(r=>r.guard).map(r=>({name:r.name,target:r.count,done:wk.blocks.filter(b=>b.done&&b.refId===r.id).length})),
    notes:wk.notes,currentCalib:S.calib,season:S.season?S.season.type:null};
  const prompt=["너는 자기관리 앱 '다음 주'의 길잡이다. 지난주 기록을 보고 JSON 하나로만 답하라.",
    '{"observations":["관찰 문장"],"adjustments":[{"text":"다음 주에 바꿀 점 한 문장","type":"calib|lighten","kind":"deep|light|out","value":1.2,"day":"월"}]}',
    '규칙: observations는 3개. 숫자와 사실만 쓰고 평가·칭찬·훈계는 하지 않는다(예: "수요일 계획 4개 중 1개를 했어요. 고정 일정이 가장 많은 날이에요."). profile.patterns와 연결되는 사실이 있으면 짚는다. adjustments는 최대 2개. calib는 작업 종류별 시간 보정 배수(0.8~2.0), lighten은 계획을 줄일 요일 하나. 근거가 없으면 빈 배열. '+toneRule()+' 한국어.',
    '기록: '+JSON.stringify(stats)].join('\n');
  const res=await runAI('review',(sample,signal)=>sample.json(prompt,{signal,cache:false}));
  if(res&&typeof res==='object'){
    wk.review={observations:(Array.isArray(res.observations)?res.observations:[]).map(String).slice(0,3),
      adjustments:(Array.isArray(res.adjustments)?res.adjustments:[]).slice(0,2).map(a=>({text:String(a.text||''),type:a.type==='lighten'?'lighten':'calib',
        kind:['deep','light','out'].includes(a.kind)?a.kind:'deep',value:clamp(Number(a.value)||1,0.8,2),day:DAYS.indexOf(String(a.day||''))})),applied:false};
    ui.adjOn={0:true,1:true};store.save();
  }
}

  ui.chat.push({role:'user',content:text});
  const turns=[{role:'user',content:rules}].concat(ui.chat.slice(-8));
  ui.chatText='';

/* ---------- day as blocks ---------- */
const PX=1.5,WPX=0.42;
const KIND={deep:'깊은 일',light:'가벼운 일',out:'외출',rest:'쉼',event:'약속'};
const GAP_PRESETS=[{title:'깊은 일 50분',dur:50,kind:'deep',src:'card'},{title:'산책',dur:20,kind:'light',src:'card'},{title:'쉼',dur:30,kind:'rest',src:'rest'}];
function durLabel(m){m=Math.max(0,Math.round(m));if(m<60)return m+'분';return Math.floor(m/60)+'시간'+(m%60?' '+m%60+'분':'');}
function bigLeft(m,tail){return m<100?'<span class="mono big">'+m+'</span><span>분 '+tail+'</span>':'<span class="mono big">'+Math.floor(m/60)+':'+pad(m%60)+'</span><span>'+tail+'</span>';}
function prefOf(b){return b.kind==='deep'?'focus':b.kind==='out'?'afternoon':'any';}
function commuteFor(day){
  const s=S.setup;if(!s.commute||day>4)return [];
  const fx=s.fixed.filter(f=>f.dow===day);if(!fx.length)return [];
  const first=fx.reduce((a,f)=>f.start<a.start?f:a,fx[0]),last=fx.reduce((a,f)=>f.end>a.end?f:a,fx[0]);
  const out=[[Math.max(0,first.start-s.commute),first.start]];
  if(!last.clearAfter)out.push([last.end,Math.min(1440,last.end+s.commute)]);
  return out;
}
function dayRange(){const s=S.setup;return [Math.max(0,Math.floor((s.dayStart-60)/60)*60),Math.min(1440,Math.ceil((s.dayEnd+30)/60)*60)];}
function modeFor(wk,d){
  const ck=curKey();if(wk.key>ck)return 'future';if(wk.key<ck)return 'past';
  const t=dow(today());return d<t?'past':d===t?'today':'future';
}
function blockState(b,mode){
  if(b.done)return 'done';if(mode==='past')return 'miss';if(mode==='future')return 'up';
  const n=nowMin();if(n>=b.start+b.dur)return 'miss';if(n>=b.start)return 'now';return 'up';
}
function dayItems(wk,d,mode){
  const s=S.setup,fx=[];
  for(const f of s.fixed)if(f.dow===d){
    fx.push({start:f.start,end:f.end,label:f.label,t:'fixed'});
    if(f.clearAfter&&s.dayEnd>f.end)fx.push({start:f.end,end:s.dayEnd,label:f.label+' 뒤엔 비워 둬요',t:'clear'});
  }
  for(const c of commuteFor(d))fx.push({start:c[0],end:c[1],label:'이동',t:'move'});
  const bl=wk.blocks.filter(b=>b.day===d&&b.dur>0).sort((a,b)=>a.start-b.start);
  const gaps=[];
  if(mode!=='past'){
    const occ=fx.map(f=>[f.start,f.end]).concat(bl.map(b=>[b.start,b.start+b.dur])).sort((a,b)=>a[0]-b[0]);
    const lo=mode==='today'?Math.ceil((nowMin()+1)/10)*10:0;
    let t=s.dayStart;
    for(const iv of occ.concat([[s.dayEnd,s.dayEnd]])){
      const gs=Math.max(t,lo),ge=Math.min(iv[0],s.dayEnd);
      if(ge-gs>=30)gaps.push({start:gs,end:ge});
      t=Math.max(t,iv[1]);
    }
  }
  return {fx,bl,gaps};
}
function isGuard(wk,b){return b.src==='rec'&&wk.recurring.some(r=>r.id===b.refId&&r.guard);}
function fitsLoose(wk,day,start,dur,skipId){
  const r=dayRange();if(start<r[0]||start+dur>r[1])return false;
  const occ=[];
  for(const f of S.setup.fixed)if(f.dow===day)occ.push([f.start,f.end]);
  for(const c of commuteFor(day))occ.push(c);
  for(const b of wk.blocks)if(b.day===day&&b.id!==skipId&&b.dur>0)occ.push([b.start,b.start+b.dur]);
  return !occ.some(iv=>start<iv[1]&&start+dur>iv[0]);
}
function findSlotLoose(wk,day,dur,minStart,skipId){
  for(let t=Math.ceil(minStart/10)*10;t+dur<=S.setup.dayEnd;t+=10)if(fitsLoose(wk,day,t,dur,skipId))return t;
  return -1;
}
function kindOf(wk,o){
  const c=wk.cards.find(x=>x.id===o.refId);if(c)return c.kind;
  const s=wk.suggestions.find(x=>x.id===o.refId);if(s)return s.kind;
  const r=wk.recurring.find(x=>x.id===o.refId);if(r)return r.kind;
  return 'light';
}
function gapCands(wk){
  const out=[];
  for(const r of wk.recurring.filter(r=>r.count>0)){
    const need=S.season?Math.min(r.count,1):r.count;
    const placed=wk.blocks.filter(b=>b.refId===r.id).length,done=wk.blocks.filter(b=>b.refId===r.id&&b.done).length;
    if(placed<need)out.push({title:r.name+(r.detail?' · '+r.detail:''),dur:r.minutes,kind:r.kind,src:'rec',refId:r.id,why:'이번 주 '+done+'/'+need+(r.guard?' · 지키는 선':''),prio:r.guard?0:2});
  }
  (wk.overflow||[]).forEach((o,i)=>{if(o.dur>0&&o.src!=='rec')out.push({title:o.title,dur:o.dur,kind:kindOf(wk,o),src:o.src,refId:o.refId,why:'자리를 못 찾았던 일',from:'overflow',idx:i,prio:1});});
  (wk.deferred||[]).forEach((o,i)=>{if(o.dur>0&&o.src!=='rec')out.push({title:o.title,dur:o.dur,kind:kindOf(wk,o),src:o.src,refId:o.refId,why:'다음 주로 넘겨 둔 일',from:'deferred',idx:i,prio:3});});
  for(const sg of wk.suggestions.filter(x=>x.accepted&&x.minutes>0&&!wk.blocks.some(b=>b.refId===x.id)))
    out.push({title:sg.title,dur:sg.minutes,kind:sg.kind,src:'sug',refId:sg.id,why:'길잡이 제안',prio:2});
  out.sort((a,b)=>a.prio-b.prio);
  return out.slice(0,6);
}
function gapStart(g,wk){let s=g.s;if(wk.key===curKey()&&g.d===dow(today()))s=Math.max(s,Math.ceil(nowMin()/5)*5);return s;}

function ribbon(wk,d){
  const mode=modeFor(wk,d);
  const bl=wk.blocks.filter(b=>b.day===d&&b.dur>0&&b.src!=='rest'&&b.kind!=='event').sort((a,b)=>a.start-b.start);
  if(!bl.length)return '';
  const done=bl.filter(b=>b.done);
  return '<div class="rib-wrap"><div class="between"><span class="small"><b class="mono" style="font-size:15px">'+done.length+' / '+bl.length+'</b> 블록 채움</span><span class="xs muted mono">'+durLabel(done.reduce((a,b)=>a+b.dur,0))+' / '+durLabel(bl.reduce((a,b)=>a+b.dur,0))+'</span></div>'+
    '<div class="rib" aria-hidden="true">'+bl.map(b=>'<i class="k-'+b.kind+' st-'+blockState(b,mode)+'" style="flex-grow:'+b.dur+'"></i>').join('')+'</div></div>';
}

      '<div class="row-wrap">'+Object.keys(KIND).map(x=>'<button type="button" class="chip'+(n.kind===x?' on':'')+'" data-act="gap-kind" data-v="'+x+'"><span class="dot k-'+x+'"></span>'+KIND[x]+'</button>').join('')+'</div>'+
      '<button type="button" class="chip'+(n.lock?' on':'')+'" data-act="gap-lock" aria-pressed="'+!!n.lock+'" style="align-self:flex-start">시간 고정 · 길잡이가 옮기지 않아요</button>'+'<button type="button" class="btn primary block" data-act="gap-add">이 블록 넣기</button></div>';

function blkAct(a,d){
  const wk=S.weeks[d.k];const b=wk&&wk.blocks.find(x=>x.id===d.id);if(!b)return;
  const v=Number(d.v)||0,n=nowMin();
  const moved=()=>{b.ifthen=templateIfThen(b);wk.blocks.sort((x,y)=>x.day-y.day||x.start-y.start);};
  switch(a){
    case 'blk-done':{
      b.done=!b.done;
      if(b.done){const same=wk.blocks.filter(x=>x.day===b.day&&x.dur>0&&x.src!=='rest');toast('끝냈어요');ui.sheet=null;}
      break;}
    case 'blk-shift':{const ns=b.start+v;if(fitsLoose(wk,b.day,ns,b.dur,b.id)){b.start=ns;b.pinned=true;moved();}else toast('그 시간엔 다른 일정이 있어요');break;}
    case 'blk-len':{const nd=clamp(b.dur+v,10,300);if(nd===b.dur)break;
      if(fitsLoose(wk,b.day,b.start,nd,b.id)){wk.placed=Math.max(0,(wk.placed||0)+nd-b.dur);b.dur=nd;b.pinned=true;if(v>0&&!ui.sheet)toast(hm(b.start+b.dur)+'까지 늘렸어요');}
      else toast('뒤에 다른 일정이 있어서 늘릴 수 없어요');break;}
    case 'blk-now':{const ns=Math.ceil(n/5)*5;
      if(fitsLoose(wk,b.day,ns,b.dur,b.id)){b.start=ns;b.pinned=true;moved();ui.sheet=null;toast('지금 시작해요 · '+hm(ns)+'–'+hm(ns+b.dur));}
      else toast('지금은 '+durLabel(b.dur)+'이 들어갈 자리가 없어요');break;}
    case 'blk-later':{const st=findSlotLoose(wk,b.day,b.dur,Math.max(n+10,b.start+10),b.id);
      if(st>=0){b.start=st;moved();ui.sheet=null;toast(hm(st)+'로 옮겼어요');}else toast('오늘은 남은 자리가 없어요. 다른 날로 옮겨 보세요');break;}
    case 'blk-otherday':{const isCur=wk.key===curKey();let to=null;
      for(let dd=b.day+1;dd<=6&&!to;dd++){const st=findSlot(dd,b.dur,prefOf(b),wk.blocks,(isCur&&dd===dow(today()))?n+30:0,b.id);if(st>=0)to={day:dd,start:st};}
      if(to){b.day=to.day;b.start=to.start;b.reason='직접 다른 날로 옮겼어요';moved();toast(DAYS[to.day]+'요일 '+hm(to.start)+'로 옮겼어요');}
      else{wk.blocks=wk.blocks.filter(x=>x.id!==b.id);wk.deferred=(wk.deferred||[]).concat([{title:b.title,dur:b.dur,src:b.src,refId:b.refId}]);toast('이번 주엔 자리가 없어 다음 주로 넘겼어요');}
      ui.sheet=null;break;}

let paint=null;
function paintCell(c){

function commitPaint(){
  const before=clone(S.setup.fixed),r=dayRange();
  for(const d of paint.days){
    const cells=[...document.querySelectorAll('#pg i[data-d="'+d+'"]')];
    const keepOut=S.setup.fixed.filter(f=>f.dow===d&&(f.end<=r[0]||f.start>=r[1]));
    const next=[];let cur=null;
    for(const c of cells){const l=c.dataset.l||'',s=Number(c.dataset.s);
      if(cur&&cur.label===l&&l){cur.end=s+30;continue;}
      if(cur)next.push(cur);cur=l?{id:uid(),dow:d,start:s,end:s+30,label:l,clearAfter:false}:null;}
    if(cur)next.push(cur);
    for(const x of next)x.clearAfter=before.some(f=>f.dow===d&&f.label===x.label&&f.clearAfter);
    S.setup.fixed=S.setup.fixed.filter(f=>f.dow!==d).concat(keepOut,next);
  }
  ui.fxUndo=before;ui.fxMsg='표를 고쳤어요.';paint=null;commit();
}
